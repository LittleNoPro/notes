          - text: .
      - paragraph [ref=e3457]:
        - strong [ref=e3458]:
          - text: c) Whitelist origin
          - code [ref=e3459]: "null"
          - text: .
        - text: Trình duyệt gửi
        - code [ref=e3460]: "Origin: null"
        - text: "khi: redirect cross-origin, request từ dữ liệu serialized, protocol"
        - code [ref=e3461]: "file:"
        - text: ", iframe sandbox. Tạo"
        - code [ref=e3462]: "null"
        - text: "bằng iframe sandbox:"
      - generic [ref=e3464]:
        - code [ref=e3466]:
          - generic [ref=e3467]: <iframe sandbox="allow-scripts allow-top-navigation allow-forms" src="data:text/html,<script>
