          - link "HTTP Host header attacks" [ref=e656] [cursor=pointer]:
            - /url: "#http-host-header-attacks"
          - text: ).
      - paragraph [ref=e657]:
        - strong [ref=e658]: "Đổi password:"
        - text: trang này dùng cùng logic kiểm tra username/password như trang login, nên cũng mắc các lỗi tương tự. Nếu username nằm trong hidden field và trang truy cập được mà không cần đăng nhập, attacker sửa username để enumerate username và brute-force password của bất kỳ ai.
      - heading "Phòng chống" [level=4] [ref=e659]
      - list [ref=e660]:
        - listitem [ref=e661]:
          - strong [ref=e662]: "Bảo vệ credential:"
          - text: không bao giờ gửi dữ liệu login qua kết nối không mã hoá, redirect HTTP sang HTTPS. Không để lộ username/email qua profile hay response.
        - listitem [ref=e663]:
          - strong [ref=e664]: "Không trông chờ vào user:"
          - text: dùng công cụ đánh giá độ mạnh password theo thời gian thực (như
          - code [ref=e665]: zxcvbn
          - text: của Dropbox) thay cho password policy truyền thống.
        - listitem [ref=e666]:
          - strong [ref=e667]: "Chống username enumeration:"
          - text: thông báo lỗi giống hệt nhau và chung chung, cùng status code, thời gian phản hồi khó phân biệt.
        - listitem [ref=e668]:
          - strong [ref=e669]: "Chống brute-force mạnh:"
          - text: rate limit nghiêm ngặt theo IP, chặn việc giả mạo IP, bắt CAPTCHA sau khi vượt ngưỡng.
        - listitem [ref=e670]:
          - strong [ref=e671]: "Kiểm tra kỹ logic xác minh:"
          - text: một check bypass được thì cũng gần như không có check.
        - listitem [ref=e672]:
          - strong [ref=e673]: "Đừng quên chức năng phụ trợ:"
          - text: reset và đổi password là attack surface ngang với trang login.
        - listitem [ref=e674]:
          - strong [ref=e675]: "MFA đúng cách:"
          - text: dùng thiết bị hoặc app tạo mã trực tiếp (như Google Authenticator), tránh dùng email và hạn chế SMS. Logic kiểm tra 2FA phải chặt chẽ.
