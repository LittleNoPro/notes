              - text: (PHP Generic Gadget Chains).
        - listitem [ref=e4038]:
          - strong [ref=e4039]: "Tự tạo chain:"
          - text: cần source code. Tìm class có magic method deserialize làm kick-off gadget, lần theo các method nó gọi cho tới khi tới sink nguy hiểm, rồi tạo object serialized với giá trị phù hợp.
