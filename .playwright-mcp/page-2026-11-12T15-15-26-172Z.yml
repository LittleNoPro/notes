        - listitem [ref=e1742]:
          - text: "HTTP/1: kỹ thuật"
          - strong [ref=e1743]: last-byte synchronization
          - text: .
        - listitem [ref=e1744]:
          - text: "HTTP/2:"
          - strong [ref=e1745]: single-packet attack
          - text: . Hoàn tất 20-30 request trong
          - strong [ref=e1746]: một gói TCP
          - text: ", loại bỏ hoàn toàn ảnh hưởng của network jitter."
