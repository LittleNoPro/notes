        - text: ), rồi chèn ký tự delimiter (
        - code [ref=e2758]: /list;aaa
        - text: ). Nếu giống response gốc thì
        - code [ref=e2759]: ;
        - text: "là delimiter của origin. Sau đó kiểm tra cache có dùng delimiter đó không bằng cách thêm extension tĩnh. Payload khai thác:"
        - code [ref=e2760]: /settings/users/list;aaa.js
        - text: . Dùng danh sách delimiter và Burp Intruder (tắt auto-encoding).
      - blockquote [ref=e2761]:
        - paragraph [ref=e2762]:
          - text: Một số delimiter bị trình duyệt xử lý trước (URL-encode
          - code [ref=e2763]: "{"
          - text: ","
          - code [ref=e2764]: "}"
          - text: ","
          - code [ref=e2765]: <
          - text: ","
          - code [ref=e2766]: ">"
          - text: ; cắt path tại
          - code [ref=e2767]: "#"
          - text: ), nên không dùng được.
      - paragraph [ref=e2768]:
        - strong [ref=e2769]: c) Delimiter decoding discrepancy.
        - text: Cache và origin decode ký tự encoded khác nhau. Ví dụ
        - code [ref=e2770]: /profile%23wcd.css
        - text: ": origin decode"
        - code [ref=e2771]: "%23"
