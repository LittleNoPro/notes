        - text: Khoảng thời gian collision có thể xảy ra gọi là
        - strong [ref=e1711]: race window
        - text: ", ví dụ khoảng thời gian rất ngắn giữa hai lần tương tác với DB."
      - heading "Limit overrun race conditions" [level=4] [ref=e1712]
      - paragraph [ref=e1713]: "Đây là dạng phổ biến nhất: vượt qua giới hạn mà business logic đặt ra. Ví dụ mã giảm giá dùng một lần:"
      - list [ref=e1714]:
        - listitem [ref=e1715]: Kiểm tra mã chưa được dùng.
        - listitem [ref=e1716]: Áp dụng giảm giá.
        - listitem [ref=e1717]: Cập nhật DB là mã đã dùng.
      - paragraph [ref=e1718]:
        - img "Race condition in discount code validation" [ref=e1719]
        - emphasis [ref=e1720]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e1721] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/race-conditions
      - paragraph [ref=e1722]:
        - text: Giữa bước 1 và bước 3 có một
        - strong [ref=e1723]: sub-state
        - text: tạm thời. Gửi nhiều request cùng lúc thì tất cả đều qua được bước kiểm tra.
      - paragraph [ref=e1724]: "Các biến thể:"
      - list [ref=e1725]:
        - listitem [ref=e1726]: Đổi một thẻ quà tặng nhiều lần.
        - listitem [ref=e1727]: Đánh giá sản phẩm nhiều lần.
        - listitem [ref=e1728]: Rút hoặc chuyển tiền vượt quá số dư.
        - listitem [ref=e1729]: Dùng lại một lời giải CAPTCHA.
        - listitem [ref=e1730]: Bypass rate limit chống brute-force.
      - paragraph [ref=e1731]:
        - text: Limit overrun là một dạng con của lỗi
        - strong [ref=e1732]: TOCTOU
        - text: (time-of-check to time-of-use).
      - paragraph [ref=e1733]:
        - strong [ref=e1734]: "Phát hiện và khai thác:"
      - list [ref=e1735]:
        - listitem [ref=e1736]: Tìm endpoint dùng một lần hoặc bị rate-limit, có tác động bảo mật.
        - listitem [ref=e1737]: Gửi nhiều request liên tiếp thật nhanh để xem có vượt giới hạn được không.
