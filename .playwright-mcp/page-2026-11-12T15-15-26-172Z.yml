        - text: 1000, nhận giảm giá, rồi bỏ bớt hàng trước khi đặt đơn. Hãy chú ý mọi chỗ giá hoặc giá trị nhạy cảm được điều chỉnh dựa trên hành động của user. Với nghiệp vụ lạ, hãy đọc tài liệu và hỏi chuyên gia trong lĩnh vực đó. Nghiệp vụ càng ít người biết thì càng nhiều bug bị bỏ sót.
      - paragraph [ref=e1109]:
        - strong [ref=e1110]: 5. Encryption oracle
      - paragraph [ref=e1111]: Input do user kiểm soát được mã hoá, và ciphertext được trả lại cho user. Như vậy attacker mã hoá được dữ liệu tuỳ ý bằng đúng thuật toán và key. Nếu chỗ khác trong ứng dụng nhận dữ liệu mã hoá bằng cùng thuật toán (ví dụ cookie “stay logged in”), attacker tạo được input hợp lệ để đưa vào. Nếu còn có thêm chức năng giải mã ngược lại, attacker dễ dàng tìm ra cấu trúc dữ liệu cần giả mạo.
      - paragraph [ref=e1112]:
        - strong [ref=e1113]: 6. Khác biệt khi parse địa chỉ email
      - paragraph [ref=e1114]:
        - text: Ứng dụng parse email để lấy domain và xác định user thuộc tổ chức nào. Attacker dùng kỹ thuật encoding để che một phần địa chỉ, tạo ra email qua được kiểm tra ban đầu nhưng được phần xử lý phía sau hiểu khác đi. Hậu quả là đăng ký được tài khoản với domain bị hạn chế và vào được khu vực nhạy cảm như trang admin. Xem thêm whitepaper
        - emphasis [ref=e1115]: Splitting the Email Atom
        - text: của PortSwigger Research.
      - heading "Phòng chống" [level=4] [ref=e1116]
      - list [ref=e1117]:
        - listitem [ref=e1118]:
          - text: Developer và tester phải
          - strong [ref=e1119]: hiểu rõ nghiệp vụ
          - text: của ứng dụng.
        - listitem [ref=e1120]:
          - strong [ref=e1121]: Không giả định ngầm
          - text: về hành vi của user hay của các phần khác trong ứng dụng. Xác định các giả định về trạng thái phía server và viết code kiểm tra chúng, kể cả kiểm tra input có hợp lý không.
        - listitem [ref=e1122]: Duy trì tài liệu thiết kế và data flow cho mọi giao dịch và workflow, ghi rõ giả định ở từng bước.
        - listitem [ref=e1123]: Viết code rõ ràng. Code khó hiểu thì cũng khó phát hiện lỗi logic.
        - listitem [ref=e1124]: Ghi chú các chỗ code khác dùng đến từng component, và nghĩ đến tác dụng phụ nếu bị thao túng.
        - listitem [ref=e1125]: Phân tích vì sao lỗi tồn tại và vì sao bị bỏ sót, để cải thiện quy trình.
      - heading "Information disclosure" [level=3] [ref=e1126]
      - paragraph [ref=e1127]:
        - img "Information disclosure" [ref=e1128]
        - emphasis [ref=e1129]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e1130] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/information-disclosure
      - heading "Khái niệm" [level=4] [ref=e1131]
      - paragraph [ref=e1132]:
        - text: Information disclosure (information leakage) là khi website
        - strong [ref=e1133]: vô tình để lộ thông tin nhạy cảm
        - text: ":"
      - list [ref=e1134]:
        - listitem [ref=e1135]: Dữ liệu về user khác (username, thông tin tài chính).
        - listitem [ref=e1136]: Dữ liệu kinh doanh nhạy cảm.
        - listitem [ref=e1137]: Chi tiết kỹ thuật về website và hạ tầng.
      - paragraph [ref=e1138]: Thông tin kỹ thuật tưởng vô hại nhưng có thể là điểm khởi đầu để mở rộng attack surface, hoặc là mảnh ghép còn thiếu để dựng một cuộc tấn công phức tạp.
      - paragraph [ref=e1139]:
        - strong [ref=e1140]: "Ví dụ:"
      - list [ref=e1141]:
        - listitem [ref=e1142]:
          - text: Lộ thư mục ẩn qua
          - code [ref=e1143]: robots.txt
          - text: hoặc directory listing.
        - listitem [ref=e1144]: Lộ source code qua file backup tạm.
        - listitem [ref=e1145]: Error message nhắc tên bảng hoặc tên cột trong DB.
        - listitem [ref=e1146]: Hiển thị thông tin cực kỳ nhạy cảm (số thẻ tín dụng) khi không cần thiết.
        - listitem [ref=e1147]: Hard-code API key, IP, credential DB trong source code.
        - listitem [ref=e1148]: Hành vi ứng dụng khác nhau tinh tế, để lộ sự tồn tại của tài nguyên hoặc username.
      - paragraph [ref=e1149]:
        - strong [ref=e1150]: "Nguyên nhân:"
      - list [ref=e1151]:
        - listitem [ref=e1152]:
          - strong [ref=e1153]: Không loại bỏ nội dung nội bộ
          - text: khỏi nội dung public, ví dụ comment của developer trong HTML.
        - listitem [ref=e1154]:
          - strong [ref=e1155]: "Cấu hình không an toàn:"
          - text: không tắt tính năng debug, cấu hình mặc định hiển thị lỗi chi tiết.
        - listitem [ref=e1156]:
          - strong [ref=e1157]: "Thiết kế ứng dụng sai:"
          - text: response khác nhau theo từng trạng thái lỗi, dẫn đến enumeration.
      - paragraph [ref=e1158]:
        - strong [ref=e1159]: "Đánh giá mức độ:"
        - text: chỉ trong một số trường hợp thì information disclosure
        - emphasis [ref=e1160]: tự nó
        - text: mới nghiêm trọng. Hãy tập trung vào
        - strong [ref=e1161]: tác động và khả năng khai thác
        - text: của thông tin bị lộ. Ví dụ, biết phiên bản framework chỉ có giá trị khi phiên bản đó có lỗ hổng đã được công bố.
      - heading "Cách tìm và khai thác" [level=4] [ref=e1162]
      - paragraph [ref=e1163]:
        - strong [ref=e1164]: "Kỹ thuật chung:"
        - text: tránh “tunnel vision”. Dữ liệu nhạy cảm thường được tìm thấy trong lúc đang test một lỗi khác.
      - list [ref=e1165]:
        - listitem [ref=e1166]:
          - strong [ref=e1167]: "Fuzzing:"
          - text: gửi kiểu dữ liệu bất ngờ và fuzz string vào các tham số đáng chú ý. Quan sát status code, thời gian phản hồi, độ dài response. Grep các từ khoá như
          - code [ref=e1168]: error
          - text: ","
          - code [ref=e1169]: invalid
          - text: ","
          - code [ref=e1170]: SELECT
          - text: ","
          - code [ref=e1171]: SQL
          - text: . Có thể dùng Burp Intruder hoặc extension Logger++.
        - listitem [ref=e1172]:
          - strong [ref=e1173]: "Burp engagement tools:"
          - emphasis [ref=e1174]: Search
          - text: (hỗ trợ regex),
          - emphasis [ref=e1175]: Find comments
          - text: (trích comment của developer),
          - emphasis [ref=e1176]: Discover content
          - text: (tìm file và thư mục không được link tới).
        - listitem [ref=e1177]:
          - strong [ref=e1178]: "Tạo ra response có thông tin:"
          - text: khiến ứng dụng thực hiện một hành động không hợp lệ trên dữ liệu (ví dụ gửi giá trị tham số sai kiểu) để nó trả về stack trace hoặc debug, đôi khi chứa luôn dữ liệu bạn cần.
      - paragraph [ref=e1179]:
        - strong [ref=e1180]: "Các nguồn rò rỉ phổ biến:"
      - table [ref=e1181]:
        - rowgroup [ref=e1182]:
          - row [ref=e1183]:
            - columnheader "Nguồn" [ref=e1184]
            - columnheader "Mô tả" [ref=e1185]
        - rowgroup [ref=e1186]:
          - row [ref=e1187]:
            - cell [ref=e1188]:
              - strong [ref=e1189]: File cho crawler
            - cell [ref=e1190]:
              - code [ref=e1191]: /robots.txt
              - text: ","
              - code [ref=e1192]: /sitemap.xml
              - text: thường liệt kê thư mục nhạy cảm cần bỏ qua
          - row [ref=e1193]:
            - cell [ref=e1194]:
              - strong [ref=e1195]: Directory listing
            - cell "Liệt kê nội dung thư mục không có trang index, làm lộ file tạm và crash dump. Nguy hiểm khi đi kèm access control yếu" [ref=e1196]
          - row [ref=e1197]:
            - cell [ref=e1198]:
              - strong [ref=e1199]: Comment của developer
            - cell "Comment HTML bị bỏ quên trên production, gợi ý thư mục ẩn hoặc logic ứng dụng" [ref=e1200]
          - row [ref=e1201]:
            - cell [ref=e1202]:
              - strong [ref=e1203]: Error message
            - cell "Lộ kiểu dữ liệu mong đợi, công nghệ và phiên bản (template engine, DB, server), giúp tìm exploit đã công bố. Sự khác nhau giữa các error message là nền tảng của SQLi, username enumeration…" [ref=e1204]
          - row [ref=e1205]:
            - cell [ref=e1206]:
              - strong [ref=e1207]: Debug data
            - cell "Biến session quan trọng, hostname và credential của back-end, tên file và thư mục, key mã hoá dữ liệu phía client. File log debug riêng cũng có thể bị truy cập" [ref=e1208]
          - row [ref=e1209]:
            - cell [ref=e1210]:
              - strong [ref=e1211]: Trang tài khoản user
            - cell [ref=e1212]:
              - text: Logic tải
              - emphasis [ref=e1213]: từng phần dữ liệu
              - text: "có thể không kiểm tra quyền:"
              - code [ref=e1214]: GET /user/personal-info?user=carlos
              - text: . Đổi
              - code [ref=e1215]: user
              - text: sẽ hiện email của người khác (xem IDOR)
          - row [ref=e1216]:
            - cell [ref=e1217]:
              - strong [ref=e1218]: File backup
            - cell [ref=e1219]:
              - text: Editor tạo file tạm như
              - code [ref=e1220]: index.php~
              - text: hoặc
              - code [ref=e1221]: .bak
              - text: . Server không thực thi các file này mà trả về dạng text, làm lộ source code chứa credential, API key, và mở đường cho lỗi khác như insecure deserialization
          - row [ref=e1222]:
            - cell [ref=e1223]:
              - strong [ref=e1224]: Cấu hình không an toàn
            - cell [ref=e1225]:
              - text: Method
              - code [ref=e1226]: TRACE
              - text: bật sẽ echo lại nguyên request, có thể lộ header xác thực nội bộ do reverse proxy chèn vào
          - row [ref=e1227]:
            - cell [ref=e1228]:
              - strong [ref=e1229]: Lịch sử version control
            - cell [ref=e1230]:
              - text: Thư mục
              - code [ref=e1231]: /.git
              - text: bị public. Tải toàn bộ về rồi dùng Git đọc log và diff, có thể thấy credential bị hard-code trong các thay đổi
      - heading "Phòng chống" [level=4] [ref=e1232]
      - list [ref=e1233]:
        - listitem [ref=e1234]:
          - text: Mọi người tham gia làm website phải biết
          - strong [ref=e1235]: thông tin nào là nhạy cảm
          - text: .
        - listitem [ref=e1236]: Audit code trong quy trình QA/build, tự động hoá việc xoá comment của developer.
        - listitem [ref=e1237]:
          - text: Dùng
          - strong [ref=e1238]: error message chung chung
          - text: tối đa.
        - listitem [ref=e1239]:
          - text: Đảm bảo đã
          - strong [ref=e1240]: tắt tính năng debug và chẩn đoán
          - text: trên production.
        - listitem [ref=e1241]: Hiểu rõ cấu hình và ảnh hưởng bảo mật của công nghệ bên thứ ba, tắt những tính năng không dùng.
      - heading "Access control vulnerabilities" [level=3] [ref=e1242]
      - paragraph [ref=e1243]:
        - img "Access control" [ref=e1244]
        - emphasis [ref=e1245]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e1246] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/access-control
      - heading "Khái niệm" [level=4] [ref=e1247]
      - paragraph [ref=e1248]:
        - text: Access control là việc giới hạn
        - strong [ref=e1249]: ai (hoặc cái gì) được phép thực hiện hành động hoặc truy cập tài nguyên
        - text: ". Trong web app, nó dựa trên hai thứ khác:"
      - list [ref=e1250]:
        - listitem [ref=e1251]:
          - strong [ref=e1252]: "Authentication:"
          - text: xác nhận user đúng là người họ nói.
        - listitem [ref=e1253]:
          - strong [ref=e1254]: "Session management:"
          - text: xác định các request tiếp theo đến từ cùng một user.
        - listitem [ref=e1255]:
          - strong [ref=e1256]: "Access control:"
          - text: quyết định user có được làm hành động đó hay không.
      - paragraph [ref=e1257]: Broken access control rất phổ biến và thường nghiêm trọng. Thiết kế access control phụ thuộc vào con người nên rất dễ sai.
      - paragraph [ref=e1258]:
        - strong [ref=e1259]: "Các loại access control:"
      - table [ref=e1260]:
        - rowgroup [ref=e1261]:
          - row [ref=e1262]:
            - columnheader "Loại" [ref=e1263]
            - columnheader "Mô tả" [ref=e1264]
            - columnheader "Ví dụ" [ref=e1265]
        - rowgroup [ref=e1266]:
          - row [ref=e1267]:
            - cell [ref=e1268]:
              - strong [ref=e1269]: Vertical
            - cell [ref=e1270]:
              - text: Giới hạn
              - emphasis [ref=e1271]: chức năng
              - text: theo loại user
            - cell "Admin xoá được account, user thường thì không" [ref=e1272]
          - row [ref=e1273]:
            - cell [ref=e1274]:
              - strong [ref=e1275]: Horizontal
            - cell [ref=e1276]:
              - text: Giới hạn
              - emphasis [ref=e1277]: tài nguyên
              - text: theo từng user
            - cell "Chỉ xem được giao dịch ngân hàng của chính mình" [ref=e1278]
          - row [ref=e1279]:
            - cell [ref=e1280]:
              - strong [ref=e1281]: Context-dependent
            - cell [ref=e1282]:
              - text: Giới hạn theo
              - emphasis [ref=e1283]: trạng thái
              - text: ứng dụng
            - cell "Không sửa được giỏ hàng sau khi đã thanh toán" [ref=e1284]
      - paragraph [ref=e1285]:
        - strong [ref=e1286]: Các mô hình bảo mật
        - text: "thường gặp:"
        - emphasis [ref=e1287]: Programmatic
        - text: (ma trận quyền lưu trong DB),
        - emphasis [ref=e1288]: DAC
        - text: (chủ tài nguyên tự cấp quyền),
        - emphasis [ref=e1289]: MAC
        - text: (kiểm soát tập trung, user không tự đổi quyền được, hay dùng trong quân sự),
        - emphasis [ref=e1290]: RBAC
        - text: (gán quyền theo role, dễ quản lý nếu số role vừa phải).
      - heading "Vertical privilege escalation" [level=4] [ref=e1291]
      - paragraph [ref=e1292]: User truy cập được chức năng không được phép, ví dụ user thường vào được trang admin.
      - paragraph [ref=e1293]:
        - strong [ref=e1294]: 1. Chức năng không được bảo vệ
      - list [ref=e1295]:
        - listitem [ref=e1296]:
          - text: Trang admin như
          - code [ref=e1297]: https://insecure-website.com/admin
          - text: truy cập được bởi bất kỳ ai. URL có thể bị lộ trong
          - code [ref=e1298]: robots.txt
          - text: hoặc bị brute-force bằng wordlist.
        - listitem [ref=e1299]:
          - strong [ref=e1300]: Security by obscurity
          - text: (đặt URL khó đoán như
          - code [ref=e1301]: /administrator-panel-yb556
          - text: ") không phải là access control. URL vẫn có thể bị lộ trong JavaScript:"
      - generic [ref=e1303]:
        - code [ref=e1305]:
          - generic [ref=e1306]: <script>
          - generic [ref=e1308]: var isAdmin = false;
          - generic [ref=e1310]: "if (isAdmin) {"
          - generic [ref=e1312]: ...
          - generic [ref=e1314]: var adminPanelTag = document.createElement('a');
          - generic [ref=e1316]: adminPanelTag.setAttribute('href', 'https://insecure-website.com/administrator-panel-yb556');
          - generic [ref=e1318]: adminPanelTag.innerText = 'Admin panel';
          - generic [ref=e1320]: ...
          - generic [ref=e1322]: "}"
          - generic [ref=e1324]: </script>
        - button [ref=e1326] [cursor=pointer]
      - paragraph [ref=e1330]:
        - strong [ref=e1331]: 2. Access control dựa trên tham số
      - paragraph [ref=e1332]: "Quyền được lưu ở chỗ user kiểm soát được (hidden field, cookie, query string):"
      - generic [ref=e1334]:
        - code [ref=e1336]:
          - generic [ref=e1337]: https://insecure-website.com/login/home.jsp?admin=true
          - generic [ref=e1339]: https://insecure-website.com/login/home.jsp?role=1
        - button [ref=e1341] [cursor=pointer]
      - paragraph [ref=e1345]: Chỉ cần sửa giá trị là có quyền admin.
      - paragraph [ref=e1346]:
        - strong [ref=e1347]: 3. Cấu hình platform sai
      - paragraph [ref=e1348]:
        - text: Rule kiểu
        - code [ref=e1349]: "DENY: POST, /admin/deleteUser, managers"
        - text: "có thể bị bypass:"
      - list [ref=e1350]:
        - listitem [ref=e1351]:
          - text: Qua header ghi đè URL
          - code [ref=e1352]: X-Original-URL
          - text: hoặc
          - code [ref=e1353]: X-Rewrite-URL
          - text: ":"
          - generic [ref=e1355]:
            - code [ref=e1357]:
              - generic [ref=e1358]: POST / HTTP/1.1
              - generic [ref=e1360]: "X-Original-URL: /admin/deleteUser"
              - generic [ref=e1362]: ...
            - button [ref=e1364] [cursor=pointer]
        - listitem [ref=e1368]:
          - text: Qua
          - strong [ref=e1369]: đổi HTTP method
          - text: ": nếu ứng dụng chấp nhận"
          - code [ref=e1370]: GET
          - text: (hoặc method khác) cho cùng hành động thì rule chặn
          - code [ref=e1371]: POST
          - text: vô dụng.
      - paragraph [ref=e1372]:
        - strong [ref=e1373]: 4. URL-matching không nhất quán
      - list [ref=e1374]:
        - listitem [ref=e1375]:
          - text: "Khác biệt hoa/thường:"
          - code [ref=e1376]: /ADMIN/DELETEUSER
          - text: vẫn được map tới
          - code [ref=e1377]: /admin/deleteUser
          - text: ", nhưng access control coi là hai endpoint khác nhau."
        - listitem [ref=e1378]:
          - text: Spring
          - code [ref=e1379]: useSuffixPatternMatch
          - text: "(mặc định bật trước Spring 5.3):"
          - code [ref=e1380]: /admin/deleteUser.anything
          - text: vẫn khớp
          - code [ref=e1381]: /admin/deleteUser
          - text: .
        - listitem [ref=e1382]:
          - text: Dấu
          - code [ref=e1383]: /
          - text: "ở cuối:"
          - code [ref=e1384]: /admin/deleteUser/
          - text: và
          - code [ref=e1385]: /admin/deleteUser
          - text: được xử lý khác nhau.
      - heading "Horizontal privilege escalation và IDOR" [level=4] [ref=e1386]
      - paragraph [ref=e1387]: "User truy cập được tài nguyên của user khác:"
      - generic [ref=e1389]:
        - code [ref=e1391]:
          - generic [ref=e1392]: https://insecure-website.com/myaccount?id=123 → đổi thành id=124
        - button [ref=e1394] [cursor=pointer]
      - paragraph [ref=e1398]:
        - strong [ref=e1399]: IDOR (Insecure Direct Object Reference)
        - text: "xảy ra khi ứng dụng dùng input của user để truy cập trực tiếp object. Thuật ngữ này phổ biến từ OWASP Top 10 năm 2007. Ví dụ:"
      - list [ref=e1400]:
        - listitem [ref=e1401]:
          - text: "Tham chiếu trực tiếp record trong DB:"
          - code [ref=e1402]: https://insecure-website.com/customer_account?customer_number=132355
        - listitem [ref=e1403]:
          - text: "Tham chiếu trực tiếp file tĩnh:"
          - code [ref=e1404]: https://insecure-website.com/static/12144.txt
          - text: . Đổi tên file là xem được transcript chat của người khác, có thể chứa credential.
      - paragraph [ref=e1405]: "Các tình huống cần chú ý:"
      - list [ref=e1406]:
        - listitem [ref=e1407]:
          - strong [ref=e1408]: GUID
          - text: thay cho số tăng dần thì khó đoán hơn, nhưng GUID của user khác có thể bị lộ ở chỗ khác như tin nhắn hay review.
        - listitem [ref=e1409]:
          - text: Ứng dụng
          - strong [ref=e1410]: redirect về trang login
          - text: khi không đủ quyền, nhưng chính response redirect đó vẫn chứa dữ liệu nhạy cảm của nạn nhân.
      - paragraph [ref=e1411]:
        - strong [ref=e1412]: "Từ horizontal lên vertical:"
        - text: dùng horizontal escalation nhắm vào tài khoản admin (
        - code [ref=e1413]: "?id=456"
        - text: ). Trang tài khoản admin có thể để lộ password, cho phép đổi password, hoặc cho truy cập thẳng chức năng đặc quyền.
      - heading "Các trường hợp khác" [level=4] [ref=e1414]
      - list [ref=e1415]:
        - listitem [ref=e1416]:
          - strong [ref=e1417]: "Quy trình nhiều bước:"
          - text: ví dụ (1) tải form, (2) submit thay đổi, (3) xác nhận. Nếu chỉ bước 1 và 2 được kiểm tra quyền, attacker gửi thẳng request của bước 3 với đủ tham số.
        - listitem [ref=e1418]:
          - strong [ref=e1419]:
            - text: Dựa trên
            - code [ref=e1420]: Referer
            - text: ":"
          - code [ref=e1421]: /admin
          - text: được bảo vệ đúng, nhưng
          - code [ref=e1422]: /admin/deleteUser
          - text: chỉ kiểm tra
          - code [ref=e1423]: Referer
          - text: có chứa
          - code [ref=e1424]: /admin
          - text: hay không. Header này do attacker kiểm soát hoàn toàn.
        - listitem [ref=e1425]:
          - strong [ref=e1426]: "Dựa trên vị trí địa lý:"
          - text: bypass bằng proxy, VPN, hoặc sửa cơ chế geolocation phía client.
      - heading "Phòng chống" [level=4] [ref=e1427]
      - paragraph [ref=e1428]: "Áp dụng defense-in-depth:"
      - list [ref=e1429]:
        - listitem [ref=e1430]:
          - strong [ref=e1431]: Không bao giờ chỉ dựa vào obfuscation.
        - listitem [ref=e1432]:
          - strong [ref=e1433]: Deny by default
          - text: ", trừ tài nguyên công khai."
        - listitem [ref=e1434]:
          - text: Dùng
          - strong [ref=e1435]: một cơ chế access control duy nhất cho toàn ứng dụng
          - text: khi có thể.
        - listitem [ref=e1436]: Ở mức code, bắt buộc developer khai báo quyền cho từng tài nguyên, mặc định là từ chối.
        - listitem [ref=e1437]: Audit và test access control kỹ lưỡng.
      - heading "File upload vulnerabilities" [level=3] [ref=e1438]
      - paragraph [ref=e1439]:
        - img "File upload vulnerabilities" [ref=e1440]
        - emphasis [ref=e1441]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e1442] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/file-upload
