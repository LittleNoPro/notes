      - paragraph [ref=e2660]:
        - img "Web cache deception" [ref=e2661]
        - emphasis [ref=e2662]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e2663] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/web-cache-deception
      - heading "Khái niệm" [level=4] [ref=e2664]
      - paragraph [ref=e2665]:
        - text: Web cache deception lừa web cache
        - strong [ref=e2666]: lưu lại nội dung động nhạy cảm
        - text: . Nguyên nhân là
        - strong [ref=e2667]: sự khác biệt giữa cách cache server và origin server xử lý request
        - text: .
      - paragraph [ref=e2668]: Attacker dụ nạn nhân truy cập một URL độc hại, khiến trình duyệt nạn nhân gửi một request “mập mờ” cho nội dung nhạy cảm. Cache hiểu nhầm đó là request cho tài nguyên tĩnh và lưu lại response. Sau đó attacker request chính URL đó để đọc response đã cache, lấy được thông tin riêng tư của nạn nhân.
      - blockquote [ref=e2669]:
        - paragraph [ref=e2670]:
          - strong [ref=e2671]: "Phân biệt với web cache poisoning:"
          - emphasis [ref=e2672]: poisoning
          - text: thao túng cache key để chèn nội dung độc hại rồi phục vụ cho user khác;
          - emphasis [ref=e2673]: deception
          - text: lừa cache lưu nội dung nhạy cảm để attacker tự lấy.
      - paragraph [ref=e2674]:
        - strong [ref=e2675]: "Kiến thức nền:"
      - list [ref=e2676]:
        - listitem [ref=e2677]:
          - strong [ref=e2678]: "Cache key:"
          - text: cache sinh từ các phần của request (thường là URL path và query parameter, đôi khi cả header). Request trùng cache key thì được phục vụ bản đã lưu (
          - emphasis [ref=e2679]: cache hit
          - text: ).
        - listitem [ref=e2680]:
          - strong [ref=e2681]: "Cache rule:"
          - text: "quyết định cái gì được cache. Thường nhắm vào tài nguyên tĩnh, không cache nội dung động. Các loại rule theo URL path:"
          - list [ref=e2682]:
            - listitem [ref=e2683]:
              - emphasis [ref=e2684]: Static file extension
              - text: (
              - code [ref=e2685]: .css
              - text: ","
              - code [ref=e2686]: .js
              - text: )
            - listitem [ref=e2687]:
              - emphasis [ref=e2688]: Static directory
              - text: (prefix
              - code [ref=e2689]: /static
              - text: ","
              - code [ref=e2690]: /assets
              - text: )
            - listitem [ref=e2691]:
              - emphasis [ref=e2692]: File name
              - text: (
              - code [ref=e2693]: robots.txt
              - text: ","
              - code [ref=e2694]: favicon.ico
              - text: )
      - heading "Dựng một tấn công cơ bản" [level=4] [ref=e2695]
      - list [ref=e2696]:
        - listitem [ref=e2697]:
          - text: Tìm endpoint trả về response động chứa thông tin nhạy cảm. Ưu tiên method
          - code [ref=e2698]: GET
          - text: ","
          - code [ref=e2699]: HEAD
          - text: ","
          - code [ref=e2700]: OPTIONS
          - text: .
        - listitem [ref=e2701]: Tìm khác biệt trong cách cache và origin parse URL path (map URL, xử lý ký tự phân cách, chuẩn hoá path).
        - listitem [ref=e2702]: Tạo URL độc hại lợi dụng khác biệt đó. Sau khi nạn nhân truy cập, dùng Burp (không dùng trình duyệt) để request lại URL và lấy response đã cache.
      - paragraph [ref=e2703]:
        - strong [ref=e2704]: "Cache buster:"
        - text: mỗi request test phải có cache key khác nhau để không bị phục vụ bản cache cũ. Thêm query string thay đổi mỗi lần, hoặc dùng Param Miner (
        - emphasis [ref=e2705]: Add dynamic cachebuster
        - text: ).
      - paragraph [ref=e2706]:
        - strong [ref=e2707]: "Nhận biết response đã cache:"
        - text: xem header và thời gian phản hồi.
      - list [ref=e2708]:
        - listitem [ref=e2709]:
          - code [ref=e2710]: "X-Cache: hit"
          - text: (từ cache) /
          - code [ref=e2711]: miss
          - text: (từ origin) /
          - code [ref=e2712]: dynamic
          - text: (sinh động, không phù hợp cache) /
          - code [ref=e2713]: refresh
          - text: .
        - listitem [ref=e2714]:
          - code [ref=e2715]: "Cache-Control: public"
          - text: với
          - code [ref=e2716]: max-age > 0
          - text: .
        - listitem [ref=e2717]: Cùng một request mà thời gian phản hồi chênh lệch lớn.
      - heading "Khai thác static extension cache rule" [level=4] [ref=e2718]
      - paragraph [ref=e2719]:
        - strong [ref=e2720]: a) Path mapping discrepancy.
