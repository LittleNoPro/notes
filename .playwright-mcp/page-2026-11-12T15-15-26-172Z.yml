      - heading "Khái niệm" [level=4] [ref=e51]
      - paragraph [ref=e52]: SQL injection là lỗ hổng cho phép attacker can thiệp vào câu truy vấn mà ứng dụng gửi tới database. Attacker có thể đọc dữ liệu vốn không được phép xem (dữ liệu của user khác, hoặc bất kỳ dữ liệu nào ứng dụng truy cập được). Trong nhiều trường hợp attacker còn sửa hoặc xoá được dữ liệu, làm thay đổi lâu dài nội dung và hành vi của ứng dụng.
      - paragraph [ref=e53]: Ở một số tình huống, SQLi có thể leo thang thành chiếm quyền server hoặc hạ tầng back-end, hoặc gây denial-of-service.
      - paragraph [ref=e54]:
        - strong [ref=e55]: "Tác động:"
        - text: lộ password, thông tin thẻ tín dụng, thông tin cá nhân. Attacker có thể cài backdoor lâu dài vào hệ thống mà không bị phát hiện trong thời gian dài.
