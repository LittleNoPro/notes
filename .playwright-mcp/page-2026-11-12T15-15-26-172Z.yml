      - heading "Đối chiếu với OWASP API Security Top 10 (2023)" [level=4] [ref=e2639]
      - paragraph [ref=e2640]:
        - text: "Nhiều rủi ro API trùng với các chủ đề khác:"
        - emphasis [ref=e2641]: Broken object level authorization
        - text: và
        - emphasis [ref=e2642]: Broken function level authorization
        - text: → Access control;
        - emphasis [ref=e2643]: Broken authentication
        - text: → Authentication, OAuth, JWT;
        - emphasis [ref=e2644]: Broken object property level authorization
        - text: → Mass assignment;
        - emphasis [ref=e2645]: Unrestricted resource consumption
        - text: → Race conditions, File upload;
        - emphasis [ref=e2646]: Server side request forgery
        - text: → SSRF;
        - emphasis [ref=e2647]: Security misconfiguration
        - text: → CORS, Information disclosure, Host header, Request smuggling.
      - heading "Phòng chống" [level=4] [ref=e2648]
      - list [ref=e2649]:
        - listitem [ref=e2650]: Bảo vệ tài liệu nếu API không công khai, nhưng giữ tài liệu cập nhật cho tester hợp lệ.
