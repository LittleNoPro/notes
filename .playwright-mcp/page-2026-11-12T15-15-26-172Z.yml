      - heading "Business logic vulnerabilities" [level=3] [ref=e949]
      - paragraph [ref=e950]:
        - img "Business logic vulnerabilities" [ref=e951]
        - emphasis [ref=e952]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e953] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/logic-flaws
      - heading "Khái niệm" [level=4] [ref=e954]
      - paragraph [ref=e955]:
        - text: Business logic vulnerability (còn gọi là
        - emphasis [ref=e956]: application logic vulnerability
        - text: hay
        - emphasis [ref=e957]: logic flaw
        - text: ) là lỗi trong thiết kế và triển khai khiến ứng dụng có hành vi ngoài ý muốn. Attacker dùng chính các chức năng hợp lệ để đạt mục đích xấu. Lỗi này xuất phát từ việc không lường trước các trạng thái bất thường và không xử lý chúng an toàn.
      - paragraph [ref=e958]: "Các đặc điểm chính:"
      - list [ref=e959]:
        - listitem [ref=e960]: Dùng ứng dụng bình thường thì không thấy lỗi. Chỉ khi tương tác theo cách developer không ngờ tới thì lỗi mới lộ ra.
        - listitem [ref=e961]:
          - text: Rất đa dạng và thường đặc thù cho từng ứng dụng. Muốn tìm cần hiểu nghiệp vụ, nên
          - strong [ref=e962]: scanner tự động khó phát hiện
          - text: . Đây là mảnh đất tốt cho bug bounty và test thủ công.
      - paragraph [ref=e963]:
        - strong [ref=e964]: "Nguyên nhân:"
        - text: đội phát triển đưa ra
        - strong [ref=e965]: giả định sai
        - text: về cách user tương tác với ứng dụng. Ví dụ, giả định rằng user chỉ gửi dữ liệu qua trình duyệt nên chỉ validate ở client. Lỗi đặc biệt hay gặp trong hệ thống phức tạp, nơi developer phụ trách một component lại hiểu sai cách component khác hoạt động.
      - paragraph [ref=e966]:
        - strong [ref=e967]: "Tác động:"
        - text: phụ thuộc vào chức năng liên quan. Ở authentication thì có thể leo thang quyền hoặc bypass đăng nhập. Ở giao dịch tài chính thì gây mất tiền, gian lận. Hành vi kỳ lạ nên được sửa ngay cả khi bạn chưa tìm ra cách khai thác.
      - heading "Các dạng lỗi điển hình" [level=4] [ref=e968]
      - paragraph [ref=e969]:
        - strong [ref=e970]: 1. Tin tưởng quá mức vào kiểm tra phía client
      - paragraph [ref=e971]: Giả định user chỉ dùng giao diện web nên validate ở client là đủ. Thực tế attacker dùng Burp Proxy để sửa dữ liệu sau khi trình duyệt gửi đi và trước khi server xử lý, ví dụ sửa giá sản phẩm trong request.
      - paragraph [ref=e972]:
        - strong [ref=e973]: 2. Không xử lý input bất thường
      - paragraph [ref=e974]: "Ví dụ chuyển tiền:"
      - generic [ref=e976]:
        - code [ref=e978]:
          - generic [ref=e979]: $transferAmount = $_POST['amount'];
          - generic [ref=e981]: $currentBalance = $user->getBalance();
          - generic [ref=e983]: "if ($transferAmount <= $currentBalance) {"
          - generic [ref=e985]: // Complete the transfer
          - generic [ref=e987]: "} else {"
          - generic [ref=e989]: "// Block the transfer: insufficient funds"
          - generic [ref=e991]: "}"
        - button [ref=e993] [cursor=pointer]
      - paragraph [ref=e997]:
        - text: Gửi
        - code [ref=e998]: amount = -1000
        - text: thì điều kiện luôn đúng, và tiền chảy theo
        - strong [ref=e999]: chiều ngược lại
        - text: ", từ nạn nhân sang attacker."
      - paragraph [ref=e1000]: "Khi audit, hãy gửi các giá trị nằm ngoài phạm vi user bình thường hay nhập: số cực lớn hoặc cực nhỏ, chuỗi cực dài, kiểu dữ liệu bất ngờ. Sau đó trả lời các câu hỏi:"
      - list [ref=e1001]:
        - listitem [ref=e1002]: Dữ liệu có bị giới hạn không?
        - listitem [ref=e1003]: Chuyện gì xảy ra khi chạm giới hạn (ví dụ integer overflow làm tổng tiền quay vòng sang số âm)?
        - listitem [ref=e1004]: Input có bị biến đổi hoặc chuẩn hoá không (ví dụ chuỗi bị cắt ngắn)?
      - paragraph [ref=e1005]: Một form xử lý sai thì các form khác thường cũng sai tương tự.
      - paragraph [ref=e1006]:
        - strong [ref=e1007]: 3. Giả định sai về hành vi của user
      - list [ref=e1008]:
        - listitem [ref=e1009]:
          - emphasis [ref=e1010]: "User đáng tin không phải lúc nào cũng đáng tin:"
          - text: qua được kiểm tra ban đầu rồi không có nghĩa là được tin mãi. Quy tắc phải được áp dụng nhất quán ở mọi nơi.
        - listitem [ref=e1011]:
          - emphasis [ref=e1012]: "User không phải lúc nào cũng gửi đủ trường bắt buộc:"
          - text: "attacker có thể xoá hẳn tham số. Khi nhiều chức năng dùng chung một script, việc có hay không có một tham số có thể quyết định nhánh code nào được chạy. Khi test:"
          - list [ref=e1013]:
            - listitem [ref=e1014]:
              - text: Xoá
              - strong [ref=e1015]: từng tham số một
              - text: .
            - listitem [ref=e1016]:
              - text: Thử xoá cả
              - strong [ref=e1017]: tên
              - text: tham số chứ không chỉ giá trị.
            - listitem [ref=e1018]: Theo quy trình nhiều bước đến cùng, vì sửa ở bước này có thể ảnh hưởng bước sau.
            - listitem [ref=e1019]:
              - text: Kiểm tra cả URL,
              - code [ref=e1020]: POST
              - text: và
              - strong [ref=e1021]: cookie
              - text: .
        - listitem [ref=e1022]:
          - emphasis [ref=e1023]: "User không phải lúc nào cũng đi đúng trình tự:"
          - text: dùng
          - strong [ref=e1024]: forced browsing
          - text: để bỏ qua bước, lặp lại bước, hoặc quay lại bước trước (ví dụ bỏ qua bước nhập mã 2FA). Hãy chú ý error message và thông tin debug khi ứng dụng rơi vào trạng thái không nhất quán.
      - paragraph [ref=e1025]:
        - strong [ref=e1026]: 4. Lỗi đặc thù theo nghiệp vụ (domain-specific)
      - paragraph [ref=e1027]:
        - text: Chức năng giảm giá là attack surface kinh điển. Ví dụ shop giảm 10% cho đơn trên
