        - text: Khó khăn chính là
        - strong [ref=e1739]: căn thời gian
        - text: sao cho các race window trùng nhau, vì network jitter và server-side jitter. Burp Repeater (từ bản 2023.9) hỗ trợ
        - emphasis [ref=e1740]: Send group in parallel
        - text: ":"
