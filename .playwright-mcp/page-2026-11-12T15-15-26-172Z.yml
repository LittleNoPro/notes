      - heading "Khái niệm" [level=4] [ref=e499]
      - paragraph [ref=e500]:
        - strong [ref=e501]: Authentication
        - text: "là quá trình xác minh danh tính của user hoặc client. Có ba loại factor:"
      - list [ref=e502]:
        - listitem [ref=e503]:
          - text: Thứ bạn
          - strong [ref=e504]: biết
          - text: "(knowledge factor): password, câu hỏi bảo mật."
        - listitem [ref=e505]:
          - text: Thứ bạn
          - strong [ref=e506]: có
          - text: "(possession factor): điện thoại, security token."
        - listitem [ref=e507]:
          - text: Thứ bạn
          - strong [ref=e508]: là
          - text: hoặc
          - strong [ref=e509]: làm
          - text: "(inherence factor): sinh trắc học, hành vi."
      - blockquote [ref=e510]:
        - paragraph [ref=e511]:
          - strong [ref=e512]: "Authentication và authorization khác nhau:"
          - text: authentication xác minh
          - emphasis [ref=e513]: bạn có đúng là người bạn nói không
          - text: ", còn authorization xác minh"
          - emphasis [ref=e514]: bạn có được phép làm việc đó không
          - text: .
      - paragraph [ref=e515]:
        - strong [ref=e516]: Nguyên nhân
        - text: "lỗ hổng thường thuộc một trong hai nhóm:"
      - list [ref=e517]:
        - listitem [ref=e518]: Cơ chế xác thực yếu, không chống được brute-force.
        - listitem [ref=e519]: Lỗi logic hoặc code kém khiến attacker bypass được hoàn toàn cơ chế xác thực (“broken authentication”).
      - paragraph [ref=e520]:
        - strong [ref=e521]: "Tác động:"
        - text: attacker có toàn bộ dữ liệu và chức năng của tài khoản bị chiếm. Nếu là tài khoản admin, attacker kiểm soát được cả ứng dụng và có thể vào được hạ tầng nội bộ. Ngay cả tài khoản quyền thấp cũng mở thêm attack surface, ví dụ các trang nội bộ.
      - heading "Lỗ hổng trong đăng nhập bằng password" [level=4] [ref=e522]
      - paragraph [ref=e523]:
        - strong [ref=e524]: "Brute-force username:"
        - text: username thường theo pattern dễ đoán (
        - code [ref=e525]: firstname.lastname@company.com
        - text: ","
        - code [ref=e526]: admin
        - text: ","
        - code [ref=e527]: administrator
        - text: ). Hãy kiểm tra xem profile công khai hoặc HTTP response có làm lộ username hay email (kể cả email admin/IT support) không.
      - paragraph [ref=e528]:
        - strong [ref=e529]: "Brute-force password:"
        - text: "password policy (độ dài tối thiểu, chữ hoa/thường, ký tự đặc biệt) bị con người lách theo cách dễ đoán:"
        - code [ref=e530]: mypassword
        - text: thành
        - code [ref=e531]: Mypassword1!
        - text: hoặc
        - code [ref=e532]: Myp4$$w0rd
        - text: ". Khi bị bắt đổi định kỳ, user chỉ thay đổi nhỏ:"
        - code [ref=e533]: Mypassword1!
        - text: thành
        - code [ref=e534]: Mypassword1?
        - text: hoặc
        - code [ref=e535]: Mypassword2!
        - text: . Biết được các pattern này thì brute-force hiệu quả hơn nhiều so với thử mọi tổ hợp.
      - paragraph [ref=e536]:
        - strong [ref=e537]: "Username enumeration:"
        - text: "quan sát sự khác biệt trong hành vi của website để biết username có tồn tại hay không. Thường gặp ở trang login (username đúng, password sai) hoặc trang đăng ký (username đã có người dùng). Cần chú ý:"
      - list [ref=e538]:
        - listitem [ref=e539]:
          - strong [ref=e540]: "Status code:"
          - text: một code khác với đa số là dấu hiệu username đúng.
        - listitem [ref=e541]:
          - strong [ref=e542]: "Error message:"
          - text: thông báo khác nhau giữa “sai cả hai” và “sai password”. Đôi khi chỉ lệch một ký tự, thậm chí một ký tự không hiển thị trên trang.
        - listitem [ref=e543]:
          - strong [ref=e544]: "Response time:"
          - text: website có thể chỉ kiểm tra password khi username hợp lệ, nên mất thêm thời gian. Gửi password thật dài sẽ khuếch đại độ trễ này.
      - heading "Brute-force protection có lỗ hổng" [level=4] [ref=e545]
      - paragraph [ref=e546]:
        - text: Hai cách phổ biến là
        - strong [ref=e547]: khoá account
        - text: và
        - strong [ref=e548]: chặn IP
        - text: "khi có quá nhiều lần thử. Cả hai đều có thể bị qua mặt khi logic sai:"
      - list [ref=e549]:
        - listitem [ref=e550]:
          - strong [ref=e551]: "Reset counter khi đăng nhập thành công:"
          - text: nếu bộ đếm theo IP được reset khi đăng nhập thành công, attacker chỉ cần chèn credential của chính mình vào wordlist sau mỗi vài lần thử.
        - listitem [ref=e552]:
          - strong [ref=e553]: "Account locking:"
          - list [ref=e554]:
            - listitem [ref=e555]: Thông báo “account bị khoá” cũng có thể dùng để enumerate username.
            - listitem [ref=e556]: Không chống được kiểu tấn công “chiếm account bất kỳ”. Lập danh sách username có khả năng hợp lệ, chọn số password ≤ số lần thử cho phép (ví dụ 3), rồi thử mỗi password với mọi username. Chỉ cần một user dùng một trong ba password đó.
            - listitem [ref=e557]:
              - text: Không chống được
              - strong [ref=e558]: credential stuffing
              - text: ": dùng các cặp"
              - code [ref=e559]: username:password
              - text: thật bị lộ từ các vụ data breach, mỗi username chỉ thử một lần. Kiểu tấn công này dựa vào việc user dùng lại password ở nhiều nơi.
        - listitem [ref=e560]:
          - strong [ref=e561]: User rate limiting
          - text: "(chặn IP khi gửi quá nhanh, mở khoá sau một thời gian, bởi admin, hoặc qua CAPTCHA):"
          - list [ref=e562]:
            - listitem [ref=e563]:
              - text: Có thể bypass bằng cách giả mạo IP (ví dụ qua header như
              - code [ref=e564]: X-Forwarded-For
              - text: ).
            - listitem [ref=e565]:
              - text: Có thể bypass nếu
              - strong [ref=e566]: thử nhiều password trong một request
              - text: (ví dụ gửi mảng password trong JSON).
      - heading "HTTP basic authentication" [level=4] [ref=e567]
