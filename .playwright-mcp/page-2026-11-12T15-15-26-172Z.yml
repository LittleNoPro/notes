      - heading "Khái niệm" [level=4] [ref=e1707]
      - paragraph [ref=e1708]:
        - text: Race condition có liên hệ chặt với business logic flaw. Nó xảy ra khi website
        - strong [ref=e1709]: xử lý các request đồng thời mà không có cơ chế bảo vệ phù hợp
        - text: ", khiến nhiều thread cùng thao tác trên một dữ liệu và gây ra “collision” (va chạm). Attacker gửi các request được căn thời gian chính xác để cố ý gây collision."
