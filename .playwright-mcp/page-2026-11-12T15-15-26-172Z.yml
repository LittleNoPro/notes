      - heading "WebSockets" [level=3] [ref=e3798]
      - paragraph [ref=e3799]:
        - img "WebSockets" [ref=e3800]
        - emphasis [ref=e3801]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e3802] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/websockets
      - heading "Khái niệm" [level=4] [ref=e3803]
      - paragraph [ref=e3804]:
        - text: WebSocket là giao thức giao tiếp
        - strong [ref=e3805]: hai chiều, full-duplex
        - text: ", khởi tạo qua HTTP và duy trì kết nối lâu dài. Message gửi được theo cả hai chiều bất cứ lúc nào, không mang tính giao dịch như HTTP. Dùng cho dữ liệu thời gian thực (feed tài chính, chat…)."
        - strong [ref=e3806]: Hầu như mọi lỗ hổng web của HTTP đều có thể xảy ra với WebSocket.
      - paragraph [ref=e3807]:
        - strong [ref=e3808]: Thiết lập kết nối
        - text: bằng JavaScript (
        - code [ref=e3809]: wss://
        - text: là WebSocket qua TLS,
        - code [ref=e3810]: ws://
        - text: "không mã hoá):"
      - generic [ref=e3812]:
        - code [ref=e3814]:
          - generic [ref=e3815]: var ws = new WebSocket("wss://normal-website.com/chat");
        - button [ref=e3817] [cursor=pointer]
      - paragraph [ref=e3821]: "Handshake qua HTTP:"
      - generic [ref=e3823]:
        - code [ref=e3825]:
          - generic [ref=e3826]: GET /chat HTTP/1.1
          - generic [ref=e3828]: "Host: normal-website.com"
          - generic [ref=e3830]: "Sec-WebSocket-Version: 13"
          - generic [ref=e3832]: "Sec-WebSocket-Key: wDqumtseNBJdhkihL6PW7w=="
          - generic [ref=e3834]: "Connection: keep-alive, Upgrade"
          - generic [ref=e3836]: "Cookie: session=KOsEJNuflw4Rd9BDNrVmvwBF9rEijeE2"
          - generic [ref=e3838]: "Upgrade: websocket"
          - generic [ref=e3841]: HTTP/1.1 101 Switching Protocols
          - generic [ref=e3843]: "Connection: Upgrade"
          - generic [ref=e3845]: "Upgrade: websocket"
          - generic [ref=e3847]: "Sec-WebSocket-Accept: 0FFP+2nmNIf/h+4BP36k9uzrYGk="
        - button [ref=e3849] [cursor=pointer]
      - blockquote [ref=e3853]:
        - paragraph [ref=e3854]:
          - code [ref=e3855]: Sec-WebSocket-Key
          - text: là giá trị ngẫu nhiên chống lỗi caching proxy,
          - strong [ref=e3856]: không
          - text: dùng để xác thực.
          - code [ref=e3857]: Sec-WebSocket-Accept
          - text: là hash của key đó.
      - heading "Khai thác" [level=4] [ref=e3858]
      - paragraph [ref=e3859]: Dùng Burp để intercept/sửa message (WebSockets history), replay và tạo message mới (Repeater), và sửa cả handshake.
      - paragraph [ref=e3860]:
        - strong [ref=e3861]: a) Sửa nội dung message.
        - text: Phần lớn lỗ hổng input-based tìm bằng cách tamper message. Ví dụ chat gửi
        - code [ref=e3862]: "{\"message\":\"Hello Carlos\"}"
        - text: và render thành
        - code [ref=e3863]: <td>Hello Carlos</td>
        - text: ". Payload XSS:"
      - generic [ref=e3865]:
        - code [ref=e3867]:
          - generic [ref=e3868]: "{\"message\":\"<img src=1 onerror='alert(1)'>\"}"
        - button [ref=e3870] [cursor=pointer]
      - paragraph [ref=e3874]: Tuỳ nội dung, có thể dẫn tới SQLi, XXE, hoặc blind phải dùng OAST.
      - paragraph [ref=e3875]:
        - strong [ref=e3876]: b) Sửa handshake.
        - text: "Một số lỗ hổng là lỗi thiết kế, chỉ khai thác được qua handshake:"
      - list [ref=e3877]:
        - listitem [ref=e3878]:
          - text: Tin tưởng sai vào HTTP header để ra quyết định bảo mật (ví dụ
          - code [ref=e3879]: X-Forwarded-For
          - text: ).
        - listitem [ref=e3880]: Lỗi trong session handling (context session của message do handshake quyết định).
        - listitem [ref=e3881]: Attack surface từ các custom header.
      - paragraph [ref=e3882]:
        - strong [ref=e3883]: c) Cross-site WebSocket hijacking (CSWSH).
        - text: Về bản chất là
        - strong [ref=e3884]: CSRF trên WebSocket handshake
        - text: ": xảy ra khi handshake chỉ dựa vào cookie để xử lý session, không có CSRF token hay giá trị khó đoán."
      - paragraph [ref=e3885]:
        - text: Attacker tạo trang độc hại mở kết nối WebSocket cross-site tới ứng dụng. Kết nối được xử lý trong context session của nạn nhân. Khác với CSRF thường (một chiều), CSWSH cho
        - strong [ref=e3886]: tương tác hai chiều
        - text: ": attacker vừa gửi message (thực hiện hành động thay nạn nhân) vừa đọc message trả về (lấy dữ liệu nhạy cảm)."
      - paragraph [ref=e3887]: "Cách kiểm tra: xem handshake có được bảo vệ chống CSRF không. Nếu session token chỉ nằm trong cookie (như request handshake ở trên) thì có khả năng dính."
      - heading "Phòng chống" [level=4] [ref=e3888]
      - list [ref=e3889]:
        - listitem [ref=e3890]:
          - text: Dùng
          - code [ref=e3891]: wss://
          - text: (WebSocket qua TLS).
        - listitem [ref=e3892]:
          - strong [ref=e3893]: Hard-code URL
          - text: của endpoint, không nhúng dữ liệu user vào URL.
        - listitem [ref=e3894]: Bảo vệ handshake message chống CSRF để tránh CSWSH.
        - listitem [ref=e3895]:
          - text: Coi dữ liệu nhận qua WebSocket là
          - strong [ref=e3896]: không tin cậy ở cả hai chiều
          - text: ", xử lý an toàn ở cả server và client để tránh SQLi, XSS…"
      - separator [ref=e3897]
