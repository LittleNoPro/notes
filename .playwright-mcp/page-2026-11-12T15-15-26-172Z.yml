        - text: xảy ra khi dùng hai framework riêng cho session và CSRF. Nếu site có chức năng set cookie được (kể cả ở sibling domain cùng DNS domain), attacker đặt cặp token+cookie của mình vào trình duyệt nạn nhân.
      - paragraph [ref=e3233]:
