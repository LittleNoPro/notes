        - code [ref=e628]: account
        - text: thành tên nạn nhân và brute-force mã. Như vậy attacker vào được tài khoản nạn nhân mà
        - strong [ref=e629]: không cần biết password
        - text: .
      - paragraph [ref=e630]:
        - strong [ref=e631]: "Brute-force mã 2FA:"
        - text: mã thường chỉ có 4-6 chữ số. Cơ chế “logout sau N lần sai” không đủ, vì attacker có thể tự động hoá quy trình nhiều bước bằng macro của Burp Intruder hoặc Turbo Intruder.
      - heading "Lỗ hổng trong các cơ chế phụ trợ" [level=4] [ref=e632]
      - paragraph [ref=e633]:
        - strong [ref=e634]: "“Remember me” cookie:"
      - list [ref=e635]:
        - listitem [ref=e636]: Nếu cookie được tạo từ các giá trị tĩnh dễ đoán (username + timestamp, thậm chí cả password), attacker tạo tài khoản riêng, phân tích cookie của mình, tìm ra công thức rồi brute-force cookie của người khác.
        - listitem [ref=e637]: Base64 không phải mã hoá. Hash không có salt cũng có thể brute-force bằng cách hash wordlist, và thường không bị giới hạn số lần thử như form login.
        - listitem [ref=e638]: Có thể đánh cắp cookie qua XSS để phân tích. Framework open-source có khi còn công khai cách tạo cookie.
        - listitem [ref=e639]: Hash password không có salt nằm trong cookie đôi khi tra Google là ra plaintext.
      - paragraph [ref=e640]:
        - strong [ref=e641]: "Reset password:"
      - list [ref=e642]:
        - listitem [ref=e643]:
          - strong [ref=e644]: "Gửi password qua email:"
          - text: password tồn tại lâu, kênh truyền không an toàn, hộp thư được đồng bộ trên nhiều thiết bị.
        - listitem [ref=e645]:
          - strong [ref=e646]: "URL có tham số dễ đoán:"
          - code [ref=e647]: http://vulnerable-website.com/reset-password?user=victim-user
          - text: . Đổi
          - code [ref=e648]: user
          - text: là reset được password của người khác.
        - listitem [ref=e649]:
          - text: "Cách làm đúng là dùng token có entropy cao, không gợi ý user nào, hết hạn nhanh và bị huỷ ngay sau khi dùng:"
          - code [ref=e650]: http://vulnerable-website.com/reset-password?token=a0ba0d1cb3b6...
        - listitem [ref=e651]:
          - strong [ref=e652]: "Không kiểm tra lại token khi submit form:"
          - text: attacker mở form reset từ tài khoản của mình, xoá token đi, rồi reset password của user bất kỳ.
        - listitem [ref=e653]:
          - strong [ref=e654]: "Password reset poisoning:"
          - text: nếu URL trong email được sinh động (ví dụ dựa vào header
          - code [ref=e655]: Host
