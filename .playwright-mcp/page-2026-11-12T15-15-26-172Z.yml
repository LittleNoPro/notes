      - list [ref=e579]:
        - listitem [ref=e580]:
          - text: Credential bị gửi lại ở
          - strong [ref=e581]: mọi request
          - text: . Nếu không có HSTS, credential có thể bị bắt qua man-in-the-middle.
        - listitem [ref=e582]: Thường không có chống brute-force, và token chỉ gồm giá trị tĩnh.
        - listitem [ref=e583]: Không tự chống được các tấn công dựa trên session, đặc biệt là CSRF.
        - listitem [ref=e584]: Credential lộ ra có thể được dùng lại ở nơi khác quan trọng hơn.
      - heading "Lỗ hổng trong multi-factor authentication (MFA/2FA)" [level=4] [ref=e585]
      - list [ref=e586]:
        - listitem [ref=e587]:
          - text: MFA chỉ thật sự có ý nghĩa khi xác minh các
          - strong [ref=e588]: factor khác nhau
          - text: . 2FA qua email chỉ là kiểm tra knowledge factor hai lần.
        - listitem [ref=e589]:
          - text: 2FA qua SMS có thể bị chặn bắt mã, hoặc bị
          - strong [ref=e590]: SIM swapping
          - text: .
      - paragraph [ref=e591]:
        - strong [ref=e592]: "Bypass 2FA hoàn toàn:"
        - text: nếu nhập password xong user đã ở trạng thái “đăng nhập” trước bước nhập mã, hãy thử truy cập thẳng các trang chỉ dành cho người đã đăng nhập. Website có thể không kiểm tra bước 2 đã hoàn tất hay chưa.
      - paragraph [ref=e593]:
        - strong [ref=e594]: "Logic xác minh 2FA sai:"
        - text: website không kiểm tra người hoàn thành bước 2 có đúng là người đã qua bước 1 không.
