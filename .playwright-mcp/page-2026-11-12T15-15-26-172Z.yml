      - heading "Khái niệm" [level=4] [ref=e2820]
      - paragraph [ref=e2821]:
        - text: XSS cho phép attacker
        - strong [ref=e2822]: chèn JavaScript độc hại
        - text: chạy trong trình duyệt của nạn nhân, qua đó phá vỡ same-origin policy. Attacker có thể giả làm nạn nhân, làm mọi hành động và đọc mọi dữ liệu mà nạn nhân có quyền. Nếu nạn nhân có quyền cao, attacker có thể chiếm toàn quyền ứng dụng.
      - paragraph [ref=e2823]:
        - strong [ref=e2824]: "XSS dùng để:"
        - text: mạo danh user, thực hiện hành động thay user, đọc dữ liệu của user, lấy credential, deface trang, chèn chức năng trojan.
      - paragraph [ref=e2825]:
        - strong [ref=e2826]: Tác động
        - text: "phụ thuộc vào ứng dụng và quyền của user bị tấn công: thấp với trang brochureware, nghiêm trọng với ứng dụng chứa dữ liệu nhạy cảm, nguy kịch nếu nạn nhân có quyền quản trị."
      - blockquote [ref=e2827]:
        - paragraph [ref=e2828]:
          - strong [ref=e2829]: "PoC:"
          - text: thường dùng
          - code [ref=e2830]: alert()
          - text: để chứng minh chạy được JavaScript. Trên Chrome từ bản 92, iframe cross-origin không gọi được
          - code [ref=e2831]: alert()
          - text: ", nên dùng"
          - code [ref=e2832]: print()
          - text: .
          - code [ref=e2833]: alert(document.domain)
          - text: cho biết script đang chạy trên domain nào.
      - heading "Ba loại XSS" [level=4] [ref=e2834]
      - paragraph [ref=e2835]:
        - strong [ref=e2836]: 1. Reflected XSS
        - text: — script độc hại đến từ
        - strong [ref=e2837]: HTTP request hiện tại
        - text: ", được phản hồi ngay trong response:"
