          - strong [ref=e3907]: "Serialization:"
          - text: chuyển cấu trúc dữ liệu phức tạp (object và field) thành chuỗi byte “phẳng” để lưu/truyền. Trạng thái object được giữ nguyên, kể cả
          - strong [ref=e3908]: private field
          - text: (trừ field đánh dấu
          - code [ref=e3909]: transient
          - text: ). Gọi là
          - emphasis [ref=e3910]: marshalling
          - text: (Ruby) hoặc
          - emphasis [ref=e3911]: pickling
          - text: (Python).
        - listitem [ref=e3912]:
          - strong [ref=e3913]: "Deserialization:"
          - text: khôi phục chuỗi byte thành bản sao object đúng trạng thái ban đầu.
      - paragraph [ref=e3914]:
        - strong [ref=e3915]: Insecure deserialization
        - text: là khi website deserialize
        - strong [ref=e3916]: dữ liệu do user kiểm soát
        - text: . Attacker sửa object serialized để đưa dữ liệu độc hại vào code, thậm chí thay bằng object của
        - strong [ref=e3917]: class hoàn toàn khác
        - text: (nên còn gọi là “object injection”). Nguy hiểm vì nhiều tấn công hoàn tất
        - strong [ref=e3918]: trước khi
        - text: deserialize xong, nên cả ngôn ngữ strongly-typed cũng dính.
      - paragraph [ref=e3919]:
        - strong [ref=e3920]: "Nguyên nhân:"
        - text: lý tưởng là không bao giờ deserialize input của user. Validate
        - emphasis [ref=e3921]: sau khi
        - text: deserialize thường đã quá muộn. Object serialized hay bị coi là đáng tin (nhất là format nhị phân, tưởng user không đọc/sửa được). Vô số dependency tạo ra một “bể” class/method khó kiểm soát.
      - paragraph [ref=e3922]:
        - strong [ref=e3923]: "Tác động:"
        - text: rất nghiêm trọng, mở rộng attack surface khổng lồ, thường dẫn tới
        - strong [ref=e3924]: RCE
        - text: . Kể cả không RCE thì cũng có thể leo thang quyền, đọc/ghi file tuỳ ý, DoS.
