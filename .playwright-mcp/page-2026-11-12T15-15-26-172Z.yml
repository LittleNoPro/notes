          - strong [ref=e3367]: cross-origin same-site
          - text: ": SameSite bất lực trước nó. Tách nội dung không an toàn (file user upload) sang site riêng, và audit cả các sibling domain."
      - heading "Cross-origin resource sharing (CORS)" [level=3] [ref=e3368]
      - paragraph [ref=e3369]:
        - img "CORS" [ref=e3370]
        - emphasis [ref=e3371]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e3372] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/cors
      - heading "Khái niệm" [level=4] [ref=e3373]
      - paragraph [ref=e3374]:
        - strong [ref=e3375]: Same-origin policy (SOP)
        - text: là cơ chế bảo mật của trình duyệt, ngăn script ở origin này đọc dữ liệu từ origin khác. Origin = scheme + domain + port. SOP cho phép gửi request tới domain khác nhưng
        - strong [ref=e3376]: không cho đọc response
        - text: . Nhờ nó mà một trang độc hại không đọc được email GMail hay tin nhắn Facebook của bạn.
      - paragraph [ref=e3377]:
        - strong [ref=e3378]: CORS
        - text: là cơ chế nới lỏng SOP một cách có kiểm soát, qua một bộ HTTP header định nghĩa origin được tin cậy.
        - strong [ref=e3379]: CORS không phải là biện pháp chống CSRF
        - text: ", cấu hình CORS kém còn làm tăng nguy cơ."
      - paragraph [ref=e3380]:
        - strong [ref=e3381]: "Các header chính:"
      - list [ref=e3382]:
        - listitem [ref=e3383]:
          - code [ref=e3384]: Origin
          - text: "(request): trình duyệt tự thêm, cho biết origin của bên gửi."
        - listitem [ref=e3385]:
          - code [ref=e3386]: Access-Control-Allow-Origin
          - text: "(ACAO, response): origin được phép đọc response. Hỗ trợ một origin,"
          - code [ref=e3387]: "null"
          - text: ", hoặc"
          - code [ref=e3388]: "*"
          - text: .
        - listitem [ref=e3389]:
          - code [ref=e3390]: "Access-Control-Allow-Credentials: true"
          - text: ": cho phép gửi kèm cookie/credential và đọc response."
        - listitem [ref=e3391]:
          - strong [ref=e3392]: "Quan trọng:"
          - text: không được kết hợp
          - code [ref=e3393]: "ACAO: *"
          - text: với
          - code [ref=e3394]: "Allow-Credentials: true"
          - text: .
        - listitem [ref=e3395]:
          - strong [ref=e3396]: "Pre-flight:"
          - text: với method hoặc header phi tiêu chuẩn, trình duyệt gửi trước một request
          - code [ref=e3397]: OPTIONS
          - text: để hỏi method/header nào được phép.
      - heading "Lỗ hổng do cấu hình CORS" [level=4] [ref=e3398]
      - paragraph [ref=e3399]:
        - strong [ref=e3400]: a) Phản chiếu Origin của client vào ACAO.
        - text: Để tránh phải duy trì danh sách domain, server đọc
        - code [ref=e3401]: Origin
        - text: "rồi đưa thẳng vào ACAO:"
      - generic [ref=e3403]:
        - code [ref=e3405]:
