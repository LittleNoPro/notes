      - heading "Khai thác" [level=4] [ref=e4230]
      - paragraph [ref=e4231]:
        - strong [ref=e4232]: 1. Argument không được kiểm soát (IDOR).
        - text: "Nếu argument truy cập object trực tiếp:"
      - generic [ref=e4234]:
        - code [ref=e4236]:
          - generic [ref=e4237]: "query { products { id name listed } }"
          - generic [ref=e4239]: "# → thấy product ID 1,2,4 (thiếu 3)"
          - generic [ref=e4242]: "query { product(id: 3) { id name listed } }"
          - generic [ref=e4244]: "# → lấy được product 3 dù đã bị delist"
        - button [ref=e4246] [cursor=pointer]
      - paragraph [ref=e4250]:
        - strong [ref=e4251]: 2. Introspection (lộ schema).
        - text: Query field
        - code [ref=e4252]: __schema
        - text: ":"
      - generic [ref=e4254]:
        - code [ref=e4256]:
          - generic [ref=e4257]: "# Dò introspection"
          - generic [ref=e4259]: "{ \"query\": \"{__schema{queryType{name}}}\" }"
        - button [ref=e4261] [cursor=pointer]
      - paragraph [ref=e4265]:
        - text: Chạy full introspection query để lấy toàn bộ query, mutation, subscription, type (nếu lỗi, xoá directive
        - code [ref=e4266]: onOperation
        - text: ","
        - code [ref=e4267]: onFragment
        - text: ","
        - code [ref=e4268]: onField
        - text: ). Dùng
        - strong [ref=e4269]: GraphQL visualizer
        - text: để xem kết quả trực quan.
      - paragraph [ref=e4270]:
        - strong [ref=e4271]: 3. Suggestions (Apollo).
        - text: Kể cả khi introspection tắt, error message của Apollo gợi ý field đúng (
        - code [ref=e4272]: Did you mean 'productInformation'?
        - text: ). Tool
        - strong [ref=e4273]: Clairvoyance
        - text: tự khôi phục schema từ suggestions.
      - paragraph [ref=e4274]:
        - strong [ref=e4275]: 4. Bypass introspection defense.
        - text: Nếu dev dùng regex loại
        - code [ref=e4276]: "__schema{"
        - text: ", chèn ký tự bị GraphQL bỏ qua (space, newline, dấu phẩy) mà regex không bắt:"
      - generic [ref=e4278]:
        - code [ref=e4280]:
          - generic [ref=e4281]: "{ \"query\": \"query{__schema {queryType{name}}}\" }"
        - button [ref=e4283] [cursor=pointer]
      - paragraph [ref=e4287]: "Hoặc đổi method (introspection có thể chỉ tắt trên POST):"
      - generic [ref=e4289]:
        - code [ref=e4291]:
          - generic [ref=e4292]: GET /graphql?query=query%7B__schema%0A%7BqueryType%7Bname%7D%7D%7D
        - button [ref=e4294] [cursor=pointer]
      - paragraph [ref=e4298]:
        - strong [ref=e4299]: 5. Bypass rate limit bằng aliases.
        - text: Alias cho phép gửi nhiều query cùng loại trong
        - strong [ref=e4300]: một HTTP request
        - text: ". Nếu rate limiter đếm theo số HTTP request, có thể brute-force (ví dụ thử nhiều discount code):"
      - generic [ref=e4302]:
        - code [ref=e4304]:
          - generic [ref=e4305]: "query isValidDiscount($code: Int) {"
          - generic [ref=e4307]: "isValidDiscount(code:$code){ valid }"
          - generic [ref=e4309]: "isValidDiscount2:isValidDiscount(code:$code){ valid }"
          - generic [ref=e4311]: "isValidDiscount3:isValidDiscount(code:$code){ valid }"
          - generic [ref=e4313]: "}"
        - button [ref=e4315] [cursor=pointer]
      - paragraph [ref=e4319]:
        - strong [ref=e4320]: 6. GraphQL CSRF.
        - text: Phát sinh khi endpoint
        - strong [ref=e4321]: không validate content type
        - text: và không có CSRF token.
        - code [ref=e4322]: POST
        - text: với
        - code [ref=e4323]: application/json
        - text: an toàn (trình duyệt không gửi được cross-site), nhưng nếu endpoint chấp nhận
        - code [ref=e4324]: GET
        - text: hoặc
        - code [ref=e4325]: x-www-form-urlencoded
        - text: thì dính CSRF.
      - heading "Phòng chống" [level=4] [ref=e4326]
      - list [ref=e4327]:
        - listitem [ref=e4328]:
          - strong [ref=e4329]: Tắt introspection
          - text: trên production (nếu API không công khai). Nếu phải bật, rà schema để không lộ field ngoài ý muốn.
        - listitem [ref=e4330]:
          - strong [ref=e4331]: Tắt suggestions
          - text: "(Apollo Server v4+:"
          - code [ref=e4332]: hideSchemaDetailsFromClientErrors
          - text: ) để chặn Clairvoyance.
        - listitem [ref=e4333]: Không để schema lộ field riêng tư (email, user ID).
        - listitem [ref=e4334]:
          - strong [ref=e4335]: "Chống brute-force/DoS:"
          - text: giới hạn
          - strong [ref=e4336]: query depth
          - text: (độ lồng nhau), cấu hình operation limit (số field/alias/root field tối đa), giới hạn kích thước query, cân nhắc
          - strong [ref=e4337]: cost analysis
          - text: .
        - listitem [ref=e4338]:
          - strong [ref=e4339]: "Chống CSRF:"
          - text: chỉ nhận query qua JSON-encoded POST, validate content type khớp, có cơ chế CSRF token.
      - heading "Server-side template injection (SSTI)" [level=3] [ref=e4340]
      - paragraph [ref=e4341]:
        - img "SSTI methodology" [ref=e4342]
        - emphasis [ref=e4343]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e4344] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/server-side-template-injection
      - heading "Khái niệm" [level=4] [ref=e4345]
      - paragraph [ref=e4346]:
        - text: SSTI là khi attacker chèn được payload bằng
        - strong [ref=e4347]: cú pháp template
        - text: vào template, và nó được
        - strong [ref=e4348]: thực thi phía server
        - text: . Template engine ghép template cố định với dữ liệu động để sinh trang web. Lỗ hổng xảy ra khi
        - strong [ref=e4349]: input của user bị nối thẳng vào template
        - text: thay vì truyền vào như dữ liệu.
      - paragraph [ref=e4350]:
        - strong [ref=e4351]: "Tác động:"
        - text: thường rất nghiêm trọng, thường là
        - strong [ref=e4352]: RCE
        - text: ", chiếm toàn quyền server. Kể cả không RCE thì cũng dùng được để đọc file và dữ liệu nhạy cảm."
      - paragraph [ref=e4353]:
        - strong [ref=e4354]: "Nguyên nhân:"
        - text: "template an toàn khi input chỉ là dữ liệu:"
      - generic [ref=e4356]:
        - code [ref=e4358]:
          - generic [ref=e4359]: "// An toàn: tên user truyền vào như dữ liệu"
          - generic [ref=e4361]: "$output = $twig->render(\"Dear {first_name},\", array(\"first_name\" => $user.first_name) );"
          - generic [ref=e4364]: "// Nguy hiểm: input nối thẳng vào template"
          - generic [ref=e4366]: $output = $twig->render("Dear " . $_GET['name']);
          - generic [ref=e4368]: "// → http://vulnerable-website.com/?name={{bad-stuff-here}}"
        - button [ref=e4370] [cursor=pointer]
      - paragraph [ref=e4374]: Đôi khi còn do cố ý cho user đặc quyền (content editor) sửa template, rất rủi ro nếu tài khoản đó bị chiếm.
      - 'heading "Quy trình khai thác: Detect → Identify → Exploit" [level=4] [ref=e4375]'
      - paragraph [ref=e4376]:
        - strong [ref=e4377]: 1. Detect (phát hiện).
        - text: Fuzz bằng chuỗi ký tự template phổ biến
        - code [ref=e4378]: "${{<%[%'\"}}%\\"
        - text: ". Nếu gây exception thì có khả năng cú pháp đang được server diễn giải. Có hai context:"
      - list [ref=e4379]:
        - listitem [ref=e4380]:
          - strong [ref=e4381]: "Plaintext context:"
          - text: "input nằm tự do trong template. Dễ bị nhầm với XSS. Test bằng phép toán:"
          - generic [ref=e4383]:
            - code [ref=e4385]:
              - generic [ref=e4386]: "http://vulnerable-website.com/?username=${7*7}"
              - generic [ref=e4388]: → Hello 49 (phép toán được tính phía server → SSTI)
            - button [ref=e4390] [cursor=pointer]
        - listitem [ref=e4394]:
          - strong [ref=e4395]: "Code context:"
          - text: input nằm trong một biểu thức template. Dễ bị bỏ sót vì không gây XSS rõ ràng. Trước tiên loại trừ XSS (
          - code [ref=e4396]: greeting=data.username<tag>
          - text: "), rồi thử thoát khỏi statement:"
          - generic [ref=e4398]:
            - code [ref=e4400]:
              - generic [ref=e4401]: "http://vulnerable-website.com/?greeting=data.username}}<tag>"
              - generic [ref=e4403]: → Hello Carlos<tag> (render đúng kèm HTML → SSTI)
            - button [ref=e4405] [cursor=pointer]
      - paragraph [ref=e4409]:
        - strong [ref=e4410]: 2. Identify (xác định engine).
        - text: Nhiều engine có cú pháp giống nhau.
      - list [ref=e4411]:
        - listitem [ref=e4412]:
          - text: Gửi cú pháp
          - strong [ref=e4413]: không hợp lệ
          - text: để error message lộ tên (và đôi khi phiên bản) engine. Ví dụ
          - code [ref=e4414]: <%=foobar%>
          - text: trên ERB (Ruby) báo
          - code [ref=e4415]: undefined local variable or method 'foobar'
          - text: .
        - listitem [ref=e4416]:
          - text: "Dùng phép toán theo cú pháp của từng engine và theo dõi engine nào tính đúng (dùng decision tree). Lưu ý một payload có thể đúng ở nhiều engine:"
          - code [ref=e4417]: "{{7*'7'}}"
          - text: ra
          - code [ref=e4418]: "49"
          - text: ở Twig nhưng
          - code [ref=e4419]: "7777777"
          - text: ở Jinja2, nên đừng vội kết luận.
      - paragraph [ref=e4420]:
        - strong [ref=e4421]: 3. Exploit (khai thác).
      - list [ref=e4422]:
        - listitem [ref=e4423]:
          - strong [ref=e4424]: "Đọc tài liệu engine:"
          - text: "học cú pháp cơ bản và cách nhúng code. Ví dụ Mako (Python):"
          - generic [ref=e4426]:
            - code [ref=e4428]:
              - generic [ref=e4429]: "<% import os x=os.popen('id').read() %> ${x}"
            - button [ref=e4431] [cursor=pointer]
          - text: "ERB (Ruby):"
          - generic [ref=e4436]:
            - code [ref=e4438]:
              - generic [ref=e4439]: <%= Dir.entries('/') %> <%= File.open('/example/arbitrary-file').read %>
            - button [ref=e4441] [cursor=pointer]
          - text: Đọc cả mục “Security” trong tài liệu, nó như một cheat sheet cho hành vi nguy hiểm.
        - listitem [ref=e4445]:
          - strong [ref=e4446]: Tìm exploit đã công bố
          - text: cho engine đó.
        - listitem [ref=e4447]:
          - strong [ref=e4448]: "Explore (khám phá môi trường):"
          - text: "nhiều engine lộ object “self”/“environment” liệt kê mọi object/method trong scope. Ví dụ Java:"
          - generic [ref=e4450]:
            - code [ref=e4452]:
              - generic [ref=e4453]: "${T(java.lang.System).getenv()}"
            - button [ref=e4455] [cursor=pointer]
          - text: Chú ý
          - strong [ref=e4459]: object do developer tự tạo
          - text: (không có trong tài liệu), vì chúng hay chứa thông tin nhạy cảm và ít được làm cứng.
        - listitem [ref=e4460]:
          - strong [ref=e4461]: Tạo exploit tuỳ chỉnh bằng object chain
          - text: (khi có sandbox). Ví dụ Velocity (Java) dùng
          - code [ref=e4462]: ClassTool
          - text: ":"
          - generic [ref=e4464]:
            - code [ref=e4466]:
              - generic [ref=e4467]: $class.inspect("java.lang.Runtime").type.getRuntime().exec("bad-stuff-here")
            - button [ref=e4469] [cursor=pointer]
      - blockquote [ref=e4473]:
        - paragraph [ref=e4474]: Kể cả khi không RCE được (do sandbox), vẫn có thể dùng SSTI cho path traversal để đọc dữ liệu nhạy cảm.
      - heading "Phòng chống" [level=4] [ref=e4475]
      - list [ref=e4476]:
        - listitem [ref=e4477]:
          - strong [ref=e4478]: Không cho user sửa hoặc submit template.
        - listitem [ref=e4479]:
          - text: Dùng template engine
          - strong [ref=e4480]: logic-less
          - text: như Mustache khi có thể, tách logic khỏi presentation.
        - listitem [ref=e4481]:
          - text: Chạy code của user trong
          - strong [ref=e4482]: sandbox
          - text: đã gỡ các module/hàm nguy hiểm (nhưng sandbox dễ bị bypass).
        - listitem [ref=e4483]: Coi RCE gần như không tránh khỏi và tự sandbox thêm, ví dụ deploy template trong Docker container bị khoá chặt.
      - heading "Web cache poisoning" [level=3] [ref=e4484]
      - paragraph [ref=e4485]:
        - img "Web cache poisoning" [ref=e4486]
        - emphasis [ref=e4487]:
          - text: "Nguồn:"
          - link "PortSwigger Web Security Academy" [ref=e4488] [cursor=pointer]:
            - /url: https://portswigger.net/web-security/web-cache-poisoning
      - heading "Khái niệm" [level=4] [ref=e4489]
      - paragraph [ref=e4490]:
        - text: Web cache poisoning lợi dụng hành vi của server và cache để
        - strong [ref=e4491]: phục vụ một response độc hại cho các user khác
        - text: ". Hai giai đoạn:"
      - list [ref=e4492]:
        - listitem [ref=e4493]: Khiến back-end trả về một response chứa payload nguy hiểm.
        - listitem [ref=e4494]:
          - text: Đảm bảo response đó
          - strong [ref=e4495]: được cache
          - text: và phục vụ cho nạn nhân.
      - paragraph [ref=e4496]:
        - text: Cache poisoning là phương tiện
        - strong [ref=e4497]: phát tán
        - text: "nhiều tấn công khác: XSS, JavaScript injection, open redirect…"
      - paragraph [ref=e4498]:
        - strong [ref=e4499]: "Cache key và unkeyed input:"
        - text: cache nhận diện request tương đương bằng cách so
        - strong [ref=e4500]: cache key
        - text: (thường là request line +
        - code [ref=e4501]: Host
        - text: ). Các phần không nằm trong cache key gọi là
        - strong [ref=e4502]: unkeyed
        - text: và bị cache bỏ qua khi quyết định phục vụ. Chính unkeyed input là nơi inject payload mà vẫn giữ cache key “bình thường”.
      - paragraph [ref=e4503]:
        - strong [ref=e4504]: Tác động
        - text: phụ thuộc vào payload cache được và lượng traffic của trang. Poison trang chủ một website lớn có thể ảnh hưởng hàng nghìn user mà không cần tương tác thêm.
      - heading "Dựng tấn công cơ bản (khai thác design flaw)" [level=4] [ref=e4505]
      - list [ref=e4506]:
        - listitem [ref=e4507]:
          - strong [ref=e4508]: Tìm và đánh giá unkeyed input.
          - text: Thêm input ngẫu nhiên vào request, xem có ảnh hưởng response không. Tự động hoá bằng
          - strong [ref=e4509]: Param Miner
          - text: (“Guess headers”). ⚠️ Luôn dùng
          - strong [ref=e4510]: cache buster
          - text: (tham số/giá trị độc nhất) để response của mình không bị phục vụ cho user thật.
        - listitem [ref=e4511]:
          - strong [ref=e4512]: Khiến back-end trả response nguy hiểm.
          - text: Tìm input được phản hồi lại mà không sanitize, hoặc dùng để sinh dữ liệu động.
        - listitem [ref=e4513]:
          - strong [ref=e4514]: Khiến response được cache
          - text: (phụ thuộc đuôi file, content type, route, status code, header).
      - paragraph [ref=e4515]:
        - strong [ref=e4516]:
          - text: Ví dụ XSS qua
          - code [ref=e4517]: X-Forwarded-Host
          - text: "(thường unkeyed):"
      - generic [ref=e4519]:
        - code [ref=e4521]:
          - generic [ref=e4522]: GET /en?region=uk HTTP/1.1
          - generic [ref=e4524]: "Host: innocent-website.com"
          - generic [ref=e4526]: "X-Forwarded-Host: a.\"><script>alert(1)</script>\""
          - generic [ref=e4529]: HTTP/1.1 200 OK
          - generic [ref=e4531]: "Cache-Control: public"
          - generic [ref=e4533]: <meta property="og:image" content="https://a."><script>alert(1)</script>"/cms/social.png" />
        - button [ref=e4535] [cursor=pointer]
      - paragraph [ref=e4539]:
        - strong [ref=e4540]: "Khai thác resource import không an toàn:"
        - text: đổi
        - code [ref=e4541]: X-Forwarded-Host
        - text: "để import JS từ domain của attacker:"
      - generic [ref=e4543]:
        - code [ref=e4545]:
          - generic [ref=e4546]: "X-Forwarded-Host: evil-user.net"
          - generic [ref=e4548]: → <script src="https://evil-user.net/static/analytics.js"></script>
        - button [ref=e4550] [cursor=pointer]
      - paragraph [ref=e4554]:
        - strong [ref=e4555]: "Các biến thể khác:"
        - text: poison qua cookie (hiếm, hay bị user thật vô tình poison); kết hợp nhiều header (ví dụ
        - code [ref=e4556]: "X-Forwarded-Proto: http"
        - text: sinh redirect cache được); poison để nạp JSON độc hại gây DOM XSS.
      - paragraph [ref=e4557]:
        - strong [ref=e4558]: "Thông tin lộ ra giúp tấn công:"
        - text: header
        - code [ref=e4559]: Age
        - text: /
        - code [ref=e4560]: Cache-Control
        - text: /
        - code [ref=e4561]: Via
        - text: cho biết khi nào nên gửi payload để chắc chắn được cache. Header
        - code [ref=e4562]: Vary
        - text: cho biết header nào được keyed (ví dụ
        - code [ref=e4563]: User-Agent
        - text: ) để nhắm đúng nhóm nạn nhân.
      - heading "Khai thác cache implementation flaw" [level=4] [ref=e4564]
      - paragraph [ref=e4565]:
        - text: Nhiều cache/CDN
        - strong [ref=e4566]: biến đổi
        - text: thành phần keyed khi lưu vào cache key (bỏ query string, lọc tham số, chuẩn hoá). Điều này tạo khác biệt giữa dữ liệu ghi vào cache key và dữ liệu đưa vào code ứng dụng.
      - paragraph [ref=e4567]:
        - strong [ref=e4568]: "Phương pháp cache probing:"
      - list [ref=e4569]:
        - listitem [ref=e4570]:
          - strong [ref=e4571]: "Tìm cache oracle:"
          - text: một trang cacheable cho biết hit/miss (qua header, nội dung động, hoặc thời gian phản hồi). Akamai hỗ trợ
          - code [ref=e4572]: "Pragma: akamai-x-get-cache-key"
          - text: để xem cache key.
        - listitem [ref=e4573]:
          - strong [ref=e4574]: "Dò xử lý key:"
          - text: gửi hai request tương tự và so sánh, tìm xem gì bị loại khỏi cache key.
        - listitem [ref=e4575]:
          - strong [ref=e4576]: Tìm gadget khai thác được
          - text: (reflected XSS, open redirect) để biến lỗ hổng reflected thành stored.
      - paragraph [ref=e4577]:
        - strong [ref=e4578]: "Các cache key flaw thường gặp:"
      - list [ref=e4579]:
        - listitem [ref=e4580]:
          - strong [ref=e4581]: "Unkeyed port:"
          - code [ref=e4582]: Host
          - text: được keyed nhưng port bị loại.
          - code [ref=e4583]: "Host: vulnerable-website.com:1337"
          - text: tạo được DoS redirect, hoặc inject XSS nếu cho port phi số.
        - listitem [ref=e4584]:
          - strong [ref=e4585]: "Unkeyed query string:"
          - text: cả query string bị loại. Trang động trông như tĩnh. Dùng cache buster trong
          - strong [ref=e4586]: header keyed
          - text: "thay vì query:"
          - generic [ref=e4588]:
            - code [ref=e4590]:
              - generic [ref=e4591]: "Accept-Encoding: gzip, deflate, cachebuster"
              - generic [ref=e4593]: "Cookie: cachebuster=1"
              - generic [ref=e4595]: "Origin: https://cachebuster.vulnerable-website.com"
            - button [ref=e4597] [cursor=pointer]
          - text: Query string unkeyed làm reflected XSS thành
          - strong [ref=e4601]: stored
          - text: và nghiêm trọng hơn.
        - listitem [ref=e4602]:
          - strong [ref=e4603]: "Unkeyed query parameters:"
          - text: chỉ loại một số tham số (như UTM
          - code [ref=e4604]: utm_content
          - text: ).
        - listitem [ref=e4605]:
          - strong [ref=e4606]: "Cache parameter cloaking:"
          - text: "lợi dụng khác biệt parse giữa cache và server để “giấu” tham số trong tham số bị loại:"
          - generic [ref=e4608]:
            - code [ref=e4610]:
              - generic [ref=e4611]: GET /?example=123?excluded_param=bad-stuff-here
              - generic [ref=e4613]: "# Ruby on Rails coi ; là delimiter, cache thì không:"
              - generic [ref=e4615]: GET /?keyed_param=abc&excluded_param=123;keyed_param=bad-stuff-here
            - button [ref=e4617] [cursor=pointer]
