          - text: . Chỉ path traversal là chưa đủ (origin sẽ báo lỗi), cần thêm delimiter mà origin dùng còn cache không, ví dụ
          - code [ref=e2793]: /profile;%2f%2e%2e%2fstatic
          - text: .
