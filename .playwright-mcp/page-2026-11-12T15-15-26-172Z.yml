      - heading "Khai thác static directory cache rule (normalization discrepancy)" [level=4] [ref=e2778]
      - paragraph [ref=e2779]: Chuẩn hoá path (decode ký tự, giải quyết dot-segment) khác nhau giữa cache và origin, tạo cơ hội path traversal.
      - paragraph [ref=e2780]:
        - text: Ví dụ
        - code [ref=e2781]: /static/..%2fprofile
        - text: ": origin decode"
        - code [ref=e2782]: /
        - text: và giải dot-segment →
        - code [ref=e2783]: /profile
        - text: ; cache thì không → thấy prefix
        - code [ref=e2784]: /static
        - text: nên lưu profile. Mỗi dot-segment phải được encode để trình duyệt không tự giải trước.
      - list [ref=e2785]:
        - listitem [ref=e2786]:
          - strong [ref=e2787]: "Origin chuẩn hoá (cache không):"
          - text: payload
