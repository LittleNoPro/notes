      - list [ref=e4027]:
        - listitem [ref=e4028]:
          - strong [ref=e4029]: "Chain dựng sẵn:"
          - text: cùng thư viện phổ biến (như Apache Commons Collections của Java) dính ở site này thì site khác cũng dính.
